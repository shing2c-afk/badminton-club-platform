    <!-- 📌 alert, confirm, prompt 전역 오버라이딩 스크립트 -->
    <script>
    window.alert = function(message) {
        const modal = document.getElementById('custom-alert-modal');
        const msgEl = document.getElementById('custom-alert-message');
        const cancelBtn = document.getElementById('custom-alert-cancel-btn');
        const promptInput = document.getElementById('custom-prompt-input');
        
        if (modal && msgEl) {
            msgEl.innerText = message;
            if (cancelBtn) cancelBtn.style.display = 'none';
            if (promptInput) promptInput.style.display = 'none';
            modal.style.display = 'flex';
        }
    };

    // 🔒 [초강력 방어벽]: 마지막으로 confirm이 호출된 시간을 기록
    let lastConfirmTime = 0;
    let lastConfirmMessage = "";

    window.confirm = function(message) {
        const modal = document.getElementById('custom-alert-modal');

        // 🛡️ [모바일 최적화 방어벽]: 이미 팝업창이 떠 있는 상태라면 중복 호출 무시
        if (modal && modal.style.display === 'flex') {
            console.warn("⚠️ [중복 팝업 방지] 이미 팝업이 열려 있습니다:", message);
            return Promise.resolve(false);
        }

        return new Promise((resolve) => {
            const msgEl = document.getElementById('custom-alert-message');
            const cancelBtn = document.getElementById('custom-alert-cancel-btn');
            const okBtn = document.getElementById('custom-alert-ok-btn');
            const promptInput = document.getElementById('custom-prompt-input');

            if (modal && msgEl) {
                msgEl.innerText = message;
                if (cancelBtn) cancelBtn.style.display = 'inline-block';
                if (promptInput) promptInput.style.display = 'none';
                modal.style.display = 'flex';

                // 기존 이벤트 복사 및 초기화로 터치 중복(이벤트 꼬임) 방지
                const newOkBtn = okBtn.cloneNode(true);
                const newCancelBtn = cancelBtn.cloneNode(true);
                okBtn.parentNode.replaceChild(newOkBtn, okBtn);
                cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

                newOkBtn.onclick = () => {
                    modal.style.display = 'none';
                    resolve(true);
                };
                newCancelBtn.onclick = () => {
                    modal.style.display = 'none';
                    resolve(false);
                };
            } else {
                resolve(window.confirm(message)); // 안전 장치
            }
        });
    };

    window.prompt = function(message) {
        return new Promise((resolve) => {
            const modal = document.getElementById('custom-alert-modal');
            const msgEl = document.getElementById('custom-alert-message');
            const cancelBtn = document.getElementById('custom-alert-cancel-btn');
            const okBtn = document.getElementById('custom-alert-ok-btn');
            const promptInput = document.getElementById('custom-prompt-input');

            if (modal && msgEl) {
                msgEl.innerText = message;
                if (cancelBtn) cancelBtn.style.display = 'inline-block';
                if (promptInput) {
                    promptInput.style.display = 'block';
                    promptInput.value = '';
                    setTimeout(() => promptInput.focus(), 100);
                }
                modal.style.display = 'flex';

                const newOkBtn = okBtn.cloneNode(true);
                const newCancelBtn = cancelBtn.cloneNode(true);
                okBtn.parentNode.replaceChild(newOkBtn, okBtn);
                cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

                const handleOk = () => {
                    const val = promptInput ? promptInput.value : '';
                    modal.style.display = 'none';
                    if (promptInput) promptInput.style.display = 'none';
                    resolve(val);
                };

                const handleCancel = () => {
                    modal.style.display = 'none';
                    if (promptInput) promptInput.style.display = 'none';
                    resolve(null);
                };

                newOkBtn.onclick = handleOk;
                newCancelBtn.onclick = handleCancel;
                
                promptInput.onkeydown = (e) => {
                    if (e.key === 'Enter') handleOk();
                };
            } else {
                resolve(null);
            }
        });
    };

    function closeCustomAlert() {
        const modal = document.getElementById('custom-alert-modal');
        if (modal) {
            modal.style.display = 'none';
        }
    }
</script>

<script>
    // 💡 [알림 하루 단위 자동 리셋 기능 추가]
    (function checkDailyNotificationReset() {
        const today = new Date().toISOString().slice(0, 10); // "YYYY-MM-DD"
        const savedDate = localStorage.getItem('app_noti_date');
        if (savedDate !== today) {
            // 날짜가 바뀌었거나 첫 접속인 경우 알림 관련 저장소 데이터 초기화
            localStorage.removeItem('app_notifications'); // 클라이언트 알림 데이터 키
            localStorage.setItem('app_noti_date', today);
            console.log('🧹 [알림 초기화 완료] 새로운 날이 시작되어 이벤트 알림 내역이 리셋되었습니다.');
        }
    })();

    // 전역 함수 선언
    window.openRegisterModal = function() {
        const modal = document.getElementById('register-modal');
        if (modal) {
            modal.style.display = 'flex';
        } else {
            console.error('❌ register-modal 요소를 찾을 수 없습니다.');
        }
    };

    window.closeRegisterModal = function() {
        const modal = document.getElementById('register-modal');
        if (modal) {
            modal.style.display = 'none';
        }
    };

    // 공지사항 로드 함수
    async function loadLatestNotice() {
        try {
            const response = await fetch('/api/notices');
            const notices = await response.json();

            const noticeElement = document.getElementById('index-notice-text');
            if (noticeElement && notices && notices.length > 0) {
                noticeElement.textContent = `📢 [공지] ${notices[0].title}`;
            } else if (noticeElement) {
                noticeElement.textContent = '📢 등록된 공지사항이 없습니다.';
            }
        } catch (error) {
            console.error('❌ 공지사항 로드 실패:', error);
        }
    }

    loadLatestNotice();

    // 실시간 소켓 수신
    if (typeof socket !== 'undefined') {
        socket.on('noticeUpdated', (newNotice) => {
            const noticeElement = document.getElementById('index-notice-text');
            if (noticeElement && newNotice) {
                noticeElement.textContent = `📢 [공지] ${newNotice.title}`;
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        const registerBtn = document.getElementById('register-btn');
        if (registerBtn) {
            registerBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const modal = document.getElementById('register-modal');
                if (modal) {
                    modal.style.display = 'flex';
                    console.log('✅ 모달 오픈 성공!');
                } else {
                    console.error('❌ register-modal 요소를 찾을 수 없습니다.');
                }
            });
        }
    });
</script>

        .catch(err => console.log('서비스 워커 등록 실패:', err));
    });
  }
</script>

<style>

}

    position: fixed;

    bottom: 24px;
    z-index: 9999;

    background-color: #059669;

}

#share-btn-container {
    position: fixed;
    right: 20px;
    bottom: 24px;
    z-index: 9999;
}

.share-btn {
    background-color: #2563eb;
    color: #ffffff;
    border: none;
    cursor: pointer;
    justify-content: center;
    gap: 6px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    position: static !important;
}

.share-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
}
</style>

<script>
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: '스마트민턴클럽 (오늘민턴)',
            text: '배드민턴 클럽 운영관리 앱입니다. 접속 후 [앱 설치]를 눌러보세요!',
            url: window.location.origin
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error('공유 실패:', err);
          }
        }
      } else {
        try {
          await navigator.clipboard.writeText(window.location.origin);
          alert('웹사이트 주소가 복사되었습니다!\n카카오톡 단톡방이나 문자에 붙여넣어 공유하세요.');
        } catch (e) {
          prompt('아래 링크를 복사해서 회원들에게 공유해 주세요:', window.location.origin);
        }
      }
    });
  }
</script>
