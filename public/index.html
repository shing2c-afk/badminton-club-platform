<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운정배드민턴클럽</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- Intro Screen -->
    <div id="intro-screen" class="intro-screen">
        <div class="intro-logo">
            <div class="logo-mark">!</div>
            <div class="logo-text">
                <div class="title">오늘 민턴!</div>
                <div class="sub">Today's Badminton</div>
            </div>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="login-screen" style="display:none;">
        <div class="login-card">
            <h2>오늘 민턴!</h2>
            <p class="login-desc">클럽 회원은 이름과 휴대폰 번호로 로그인합니다.</p>
            <input type="text" id="login-name" placeholder="이름">
            <input type="tel" id="login-phone" placeholder="휴대폰번호">
            <button id="btn-login" onclick="proceedToMain()">로그인</button>
            <hr>
            <button id="btn-guest" onclick="proceedToMain()">일일회원 입장</button>
        </div>
    </div>

    <!-- 메인 앱 화면 -->
    <div id="main-app" style="display:none;">

        <div id="toast-container"></div>

        <!-- 헤더 -->
        <div class="header">
            <button class="header-btn" onclick="handleHome()">홈</button>
            <div class="header-title">운정배드민턴클럽</div>
            <button class="header-btn" onclick="openNotiModal()">
                🔔 알림 <span class="noti-badge" id="noti-count">0</span>
            </button>
        </div>

        <!-- 회원별 이벤트 알림 모달 -->
        <div class="modal-overlay" id="noti-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <span>🔔 회원 이벤트 알림 내역</span>
                    <button class="btn-modal-close" onclick="closeNotiModal()">✕</button>
                </div>
                <div class="modal-body" id="noti-list">
                    <div style="text-align:center; color:#6b7280; font-size:12px; padding:20px 0;">새로운 알림이 없습니다.</div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="notice-bar">
                <div class="notice-text">📢 [공지] 클럽 회원 등록 및 대기열 사용 방법 안내</div>
            </div>

            <div class="tab-menu">
                <div class="tab-btn active" id="tab-game" onclick="switchTab('game')">게임 대기</div>
                <div class="tab-btn" id="tab-nanta" onclick="switchTab('nanta')">난타 대기</div>
                <div class="tab-btn" id="tab-court" onclick="switchTab('court')">코트 현황</div>
            </div>

            <div id="section-game">
                <div class="top-ctrl">
                    <button class="btn-create-room" onclick="createNewGameSlot()">게임신청 (방 개설)</button>
                    <div class="court-count-box">게임가능 코트 <span class="court-count-num" id="game-available-count">0</span></div>
                </div>
                <div id="game-slot-list"></div>
            </div>

            <div id="section-nanta" style="display:none;">
                <div class="top-ctrl">
                    <button class="btn-create-room" style="background:#ea580c;" onclick="createNewNantaSlot()">난타신청 (방 개설)</button>
                    <div class="court-count-box">난타가능 코트 <span class="court-count-num" id="nanta-available-count">0</span></div>
                </div>
                <div id="nanta-slot-list"></div>
            </div>

            <div id="section-court" style="display:none;">
                <div id="court-status-list"></div>
            </div>

            <!-- 푸터 -->
            <div class="footer">
                <button class="btn-admin-access" onclick="accessAdmin()">⚙️ 관리자 모드 접속</button>
            </div>
        </div>
    </div>

    <!-- 분리된 모듈 자바스크립트 파일 로드 -->
    <script src="/js/ui.js"></script>
    <script src="/js/socket.js"></script>
</body>
</html>
