</script>

    <!-- 📌 alert, confirm, prompt 전역 오버라이딩 스크립트 -->
    <script>
    // 🔒 전역 비동기 Resolve 핸들러 관리
    let currentConfirmResolve = null;
    let currentPromptResolve = null;

    // 🚀 [영구 이벤트 위임]: 새로고침/동적 DOM 교체와 무관하게 전역 클릭을 감지
    document.addEventListener('click', (e) => {
        const modal = document.getElementById('custom-alert-modal');
        if (!modal || modal.style.display !== 'flex') return;

        // 1. 확인 버튼 감지 (하위 아이콘/텍스트 클릭 대응)
        if (e.target.id === 'custom-alert-ok-btn' || e.target.closest('#custom-alert-ok-btn')) {
            modal.style.display = 'none';
            
            if (currentConfirmResolve) {
                const resolveFn = currentConfirmResolve;
                currentConfirmResolve = null;
                resolveFn(true);
            }
            
            if (currentPromptResolve) {
                const resolveFn = currentPromptResolve;
                currentPromptResolve = null;
                const promptInput = document.getElementById('custom-prompt-input');
                const val = promptInput ? promptInput.value : '';
                if (promptInput) promptInput.style.display = 'none';
                resolveFn(val);
            }
        }

        // 2. 취소 버튼 감지
        if (e.target.id === 'custom-alert-cancel-btn' || e.target.closest('#custom-alert-cancel-btn')) {
            modal.style.display = 'none';
            
            if (currentConfirmResolve) {
                const resolveFn = currentConfirmResolve;
                currentConfirmResolve = null;
                resolveFn(false);
            }
            
            if (currentPromptResolve) {
                const resolveFn = currentPromptResolve;
                currentPromptResolve = null;
                const promptInput = document.getElementById('custom-prompt-input');
                if (promptInput) promptInput.style.display = 'none';
                resolveFn(null);
            }
        }
    }, true); // 캡처링 단계에서 우선 감지하도록 설정

    // 브라우저 기본 alert 오버라이드
    window.alert = function(message) {
        const modal = document.getElementById('custom-alert-modal');
        const msgEl = document.getElementById('custom-alert-message');
        const cancelBtn = document.getElementById('custom-alert-cancel-btn');
        const okBtn = document.getElementById('custom-alert-ok-btn');
        const promptInput = document.getElementById('custom-prompt-input');
        
        if (modal && msgEl) {
            msgEl.innerText = message;
            if (cancelBtn) cancelBtn.style.display = 'none';
            if (promptInput) promptInput.style.display = 'none';
            if (okBtn) {
                okBtn.style.pointerEvents = 'auto';
                okBtn.style.cursor = 'pointer';
            }
            modal.style.display = 'flex';
            modal.style.zIndex = '999999';
        }
    };

    // 브라우저 기본 confirm 오버라이드 (Promise 반환)
    window.confirm = function(message, showCancel = true) {
        const modal = document.getElementById('custom-alert-modal');

        if (modal && modal.style.display === 'flex') {
            return Promise.resolve(false);
        }

        return new Promise((resolve) => {
            currentConfirmResolve = resolve;
            currentPromptResolve = null;

            const msgEl = document.getElementById('custom-alert-message');
            const cancelBtn = document.getElementById('custom-alert-cancel-btn');
            const okBtn = document.getElementById('custom-alert-ok-btn');
            const promptInput = document.getElementById('custom-prompt-input');

            if (!okBtn) {
                resolve(false);
                return;
            }

            if (modal && msgEl) {
                msgEl.innerText = message;
                
                if (cancelBtn) {
                    cancelBtn.style.display = showCancel ? 'inline-block' : 'none';
                    cancelBtn.style.pointerEvents = 'auto';
                    cancelBtn.style.cursor = 'pointer';
                }
                if (promptInput) promptInput.style.display = 'none';
                
                okBtn.style.pointerEvents = 'auto';
                okBtn.style.cursor = 'pointer';
                modal.style.display = 'flex';
                modal.style.zIndex = '999999';
            } else {
                resolve(false);
            }
        });
    };

    // 브라우저 기본 prompt 오버라이드 (Promise 반환)
    window.prompt = function(message) {
        return new Promise((resolve) => {
            currentPromptResolve = resolve;
            currentConfirmResolve = null;

            const modal = document.getElementById('custom-alert-modal');
            const msgEl = document.getElementById('custom-alert-message');
            const cancelBtn = document.getElementById('custom-alert-cancel-btn');
            const okBtn = document.getElementById('custom-alert-ok-btn');
            const promptInput = document.getElementById('custom-prompt-input');

            if (modal && msgEl) {
                msgEl.innerText = message;
                if (cancelBtn) {
                    cancelBtn.style.display = 'inline-block';
                    cancelBtn.style.pointerEvents = 'auto';
                }
                if (promptInput) {
                    promptInput.style.display = 'block';
                    promptInput.value = '';
                    setTimeout(() => promptInput.focus(), 100);
                }
                if (okBtn) {
                    okBtn.style.pointerEvents = 'auto';
                    okBtn.style.cursor = 'pointer';
                }
                modal.style.display = 'flex';
                modal.style.zIndex = '999999';

                if (promptInput) {
                    promptInput.onkeydown = (e) => {
                        if (e.key === 'Enter' && okBtn) {
                            okBtn.click();
                        }
                    };
                }
            } else {
                resolve(null);
            }
        });
    };

    function closeCustomAlert() {
        const modal = document.getElementById('custom-alert-modal');
        if (modal) {
            modal.style.display = 'none';
        }
    }
</script>

        const today = new Date().toISOString().slice(0, 10); // "YYYY-MM-DD"
        const savedDate = localStorage.getItem('app_noti_date');
        if (savedDate !== today) {
            // 날짜가 바뀌었거나 첫 접속인 경우 알림 관련 저장소 데이터 초기화
            localStorage.removeItem('app_notifications'); // 클라이언트 알림 데이터 키
            localStorage.setItem('app_noti_date', today);
            console.log('🧹 [알림 초기화 완료] 새로운 날이 시작되어 이벤트 알림 내역이 리셋되었습니다.');
        }
    })();

    // 전역 함수 선언
    window.openRegisterModal = function() {
        const modal = document.getElementById('register-modal');
        if (modal) {
            modal.style.display = 'flex';
        } else {
            console.error('❌ register-modal 요소를 찾을 수 없습니다.');
        }
    };

    window.closeRegisterModal = function() {
        const modal = document.getElementById('register-modal');
        if (modal) {
            modal.style.display = 'none';
        }
    };

    // 공지사항 로드 함수
    async function loadLatestNotice() {
        try {
            // 🏢 현재 구장 ID 확정 (URL -> 전역변수 -> 로컬스토리지 순)
            const targetClub = window.currentClubId || 
                               new URLSearchParams(window.location.search).get('club') || 
                               localStorage.getItem('preferredClubId') || 
                               'unjeong';

            // 🏢 TV 화면과 동일하게 해당 클럽 전용 공지사항 요청 파라미터 전달
            const response = await fetch(`/api/notices?club=${encodeURIComponent(targetClub)}`);
            const notices = await response.json();

            const noticeElement = document.getElementById('index-notice-text');
            if (noticeElement && notices && notices.length > 0) {
                noticeElement.textContent = `📢 [공지] ${notices[0].title}`;
            } else if (noticeElement) {
                noticeElement.textContent = '📢 등록된 공지사항이 없습니다.';
            }
        } catch (error) {
            console.error('❌ 공지사항 로드 실패:', error);
        }
    }

    loadLatestNotice();

    // 실시간 소켓 수신
    if (typeof socket !== 'undefined') {
        socket.on('noticeUpdated', (newNotice) => {
            const noticeElement = document.getElementById('index-notice-text');
            if (noticeElement && newNotice) {
                noticeElement.textContent = `📢 [공지] ${newNotice.title}`;
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        const registerBtn = document.getElementById('register-btn');
        if (registerBtn) {
            registerBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const modal = document.getElementById('register-modal');
                if (modal) {
                    modal.style.display = 'flex';
                    console.log('✅ 모달 오픈 성공!');
                } else {
                    console.error('❌ register-modal 요소를 찾을 수 없습니다.');
                }
            });
        }
    });
</script>

<script>
  const shareBtn = document.getElementById('share-btn');
  if (shareBtn) {
    shareBtn.addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: '스마트민턴클럽 (오늘민턴)',
            text: '배드민턴 클럽 운영관리 앱입니다. 접속 후 [앱 설치]를 눌러보세요!',
            url: window.location.origin
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error('공유 실패:', err);
          }
        }
      } else {
        try {
          await navigator.clipboard.writeText(window.location.origin);
          alert('웹사이트 주소가 복사되었습니다!\n카카오톡 단톡방이나 문자에 붙여넣어 공유하세요.');
        } catch (e) {
          prompt('아래 링크를 복사해서 회원들에게 공유해 주세요:', window.location.origin);
        }
      }
    });
  }
</script>
