<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운정배드민턴클럽</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0b0f19; color: #ffffff; 
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .logo-box { margin-bottom: 30px; }
        .logo-icon { font-size: 64px; margin-bottom: 10px; display: inline-block; animation: bounce 2s infinite; }
        .logo-title { font-size: 28px; font-weight: 800; color: #f59e0b; letter-spacing: -0.5px; }
        .logo-sub { font-size: 14px; color: #9ca3af; margin-top: 6px; }
        .btn-group { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
        .btn-main { padding: 15px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; }
        .btn-start { background: #2563eb; color: white; }
        .btn-login { background: #1f2937; color: #38bdf8; border: 1px solid #374151; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div class="logo-box">
        <div class="logo-icon">🏸</div>
        <div class="logo-title">운정배드민턴클럽</div>
        <div class="logo-sub">실시간 코트 예약 & 대기열 관리 시스템</div>
    </div>

    <div class="btn-group">
        <a href="/login.html" class="btn-main btn-start">클럽 입장하기 (로그인)</a>
        <a href="/index.html" class="btn-main btn-login">게스트 둘러보기</a>
    </div>

</body>
</html>
