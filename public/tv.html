<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 체육관 실시간 종합 현황판</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0a0c10; color: #ffffff; padding: 6px; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        .header { text-align: center; margin-bottom: 2px; border-bottom: 2px solid #1f293d; padding-bottom: 2px; flex-shrink: 0; }
        .header h1 { color: #66fcf1; font-size: 40px; letter-spacing: 2px; }

        .court-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 6px; width: 100%; flex-grow: 1; min-height: 0; }
        
        .court-card { background: #141824; border: 2px solid #232d42; border-radius: 6px; padding: 4px 6px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; height: 100%; }
        
        .court-card.game { border-color: #3498db; }
        .court-card.nanta { border-color: #ffa500; }
        .court-card.lesson { border-color: #9b59b6; }

        .court-title { font-size: 13px; font-weight: bold; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        
        .type-badge { font-size: 10px; padding: 1px 4px; border-radius: 3px; font-weight: bold; display: inline-flex; align-items: center; gap: 3px; }
        .badge-game { background: rgba(52, 152, 219, 0.15); color: #3498db; border: 1px solid #3498db; }
        .badge-nanta { background: rgba(255, 165, 0, 0.15); color: #ffa500; border: 1px solid #ffa500; }
        .badge-lesson { background: rgba(155, 89, 182, 0.15); color: #9b59b6; border: 1px solid #9b59b6; }

        .team-list { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; justify-content: center; min-height: 0; }
        
        .team-row { background: #1f2538; padding: 3px 6px; border-radius: 4px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .empty-text { text-align: center; color: #52607d; font-size: 14px; font-weight: bold; }
        .lesson-text { text-align: center; color: #d8b4fe; font-size: 14px; font-weight: bold; line-height: 1.2; }

        .timer-text { font-size: 11px; color: #00ff66; font-weight: bold; }

        .waiting-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 450px; flex-shrink: 0; margin-top: 6px; }
        .waiting-box { background: #141824; border: 1px solid #232d42; border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; overflow: hidden; }
        .waiting-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; color: #66fcf1; border-bottom: 1px solid #1f293d; padding-bottom: 3px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        
        .waiting-list { flex-grow: 1; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; max-height: none; }
        
        .waiting-card { background: #1f2538; border: 1px solid #2f3a52; padding: 5px 8px; border-radius: 4px; font-size: 18px; font-weight: bold; color: #ffffff; }
        .empty-queue-text { color: #52607d; font-size: 15px; font-weight: bold; padding: 4px; }
    </style>
    <script src="/js/audio.js"></script>
</head>
<body>

<!-- [수정됨] 코트 비우기 알림 상단 배너 -->
<div id="court-alert-banner" style="display: none; position: fixed; top: 30px; left: 50%; transform: translateX(-50%); color: white; padding: 35px 70px; border-radius: 16px; font-weight: bold; font-size: 45px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 99999; text-align: center; border: 4px solid rgba(255,255,255,0.3); transition: background-color 0.3s;">
    <span id="court-alert-text">알림 내용</span>
</div>

<!-- [수정됨] TV 화면 중앙에 띄울 대기방 삭제 알림 모달 팝업 -->
<div id="popupModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center;">
    <div style="background:#141824; border: 5px solid #3498db; padding:60px 80px; border-radius:20px; text-align:center; max-width:1200px; width:85%; color: #ffffff; box-shadow: 0 25px 50px rgba(0,0,0,0.8);">
        <h2 id="popupTitle" style="color: #ff4d4d; margin-bottom: 30px; font-size: 55px; font-weight: 900;">대기방 삭제 안내</h2>
        <p id="popupMessage" style="font-size: 42px; color: #ffffff; margin-bottom: 45px; line-height: 1.5; font-weight: bold;"></p>
        <button onclick="document.getElementById('popupModal').style.display='none'" style="padding: 20px 50px; font-size: 35px; font-weight: bold; background: #3498db; color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);">확인</button>
    </div>
</div>

    <div class="header">
        <h1>🏸 체육관 실시간 종합 현황판</h1>
    </div>

    <!-- 📢 [수정] 인덱스 화면과 동일하게 가로로 꽉 차고 내용이 왼쪽 정렬되는 공지 바 -->
    <div style="width: 100%; background: #161b22; border-bottom: 1px solid #30363d; border-top: 1px solid #30363d; padding: 12px 24px; box-sizing: border-box; margin-bottom: 15px;">
        <div id="tv-notice-text" style="color: #e6edf3; font-size: 20px; font-weight: bold; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
            📢 공지사항을 불러오는 중...
        </div>
    </div>

    <div class="court-grid" id="tv-court-grid"></div>

    <div class="waiting-container">
        <div class="waiting-box">
            <div class="waiting-title"><span style="color:#3498db;">🏸</span> 게임 대기팀 <span id="game-queue-count" style="color:#3498db;">(0팀)</span></div>
            <div class="waiting-list" id="game-waiting-list"></div>
        </div>
        <div class="waiting-box">
            <div class="waiting-title"><span style="color:#ffa500;">🏸</span> 난타 대기팀 <span id="nanta-queue-count" style="color:#ffa500;">(0팀)</span></div>
            <div class="waiting-list" id="nanta-waiting-list"></div>
        </div>
    </div>

<script>
    const socket = io();

    // 외부 audio.js에 선언된 맵이 없을 경우에만 안전하게 생성
    if (typeof window.pendingAnnouncements === 'undefined') {
        window.pendingAnnouncements = new Map();
    }

    // 1. TV 페이지 로드 시 최신 공지 불러오기
async function loadTvNotice() {
    try {
        const response = await fetch('/api/notices');
        const notices = await response.json();

        const noticeElement = document.getElementById('tv-notice-text');
        if (noticeElement && notices && notices.length > 0) {
            noticeElement.textContent = `📢 [공지] ${notices[0].title}`;
        } else if (noticeElement) {
            noticeElement.textContent = '📢 등록된 공지사항이 없습니다.';
        }
    } catch (error) {
        console.error('❌ TV 공지 로드 실패:', error);
    }
}

// 초기 실행
loadTvNotice();

// 2. 실시간 소켓 수신 (관리자가 공지를 올리면 TV 화면에도 즉시 반영)
if (typeof socket !== 'undefined') {
    socket.on('noticeUpdated', (newNotice) => {
        const noticeElement = document.getElementById('tv-notice-text');
        if (noticeElement && newNotice) {
            noticeElement.textContent = `📢 [공지] ${newNotice.title}`;
        }
    });
}

    function cancelVoiceAnnouncement(announcementId) {
        if (!announcementId) return;

        const possibleKeys = [
            announcementId,
            String(announcementId),
            Number(announcementId)
        ];

        possibleKeys.forEach(key => {
            if (window.pendingAnnouncements.has(key)) {
                clearTimeout(window.pendingAnnouncements.get(key));
                window.pendingAnnouncements.delete(key);
                console.log(`[방송 취소 완료] 코트 ID (${key})의 30초 대기 방송이 성공적으로 취소되었습니다.`);
            }
        });
    }

    // 접속하자마자 TV 전광판 전용 방에 등록
    socket.on('connect', () => {
        socket.emit('registerTV');
    });

    // TV 전광판 클라이언트 - 대기방 삭제 팝업 수신 리스너
    socket.on('tvPopupAlert', (data) => {
        // data 예시: { matchType: '게임', names: ['김철수', '이영희', ...], message: '...' }
        showPopupModal(data.matchType, data.names, data.message);
    });

    // 실제 화면에 팝업을 띄워주는 함수
    let popupTimer = null;
    function showPopupModal(matchType, names, message) {
        const modal = document.getElementById('popupModal');
        const title = document.getElementById('popupTitle');
        const msg = document.getElementById('popupMessage');

        if (modal && title && msg) {
            title.innerText = `[${matchType} 대기방 삭제]`;
            msg.innerHTML = `<strong>${names.join(', ')}</strong> 팀<br>${message}`;
            modal.style.display = 'flex';

            if (popupTimer) clearTimeout(popupTimer);
            popupTimer = setTimeout(() => {
                modal.style.display = 'none';
            }, 5000);
        }
    }

    // 브라우저 내장 음성 합성(TTS) 함수
    function playVoiceAnnouncement(text, delaySeconds = 0, announcementId = null) {
        if ('speechSynthesis' in window) {
            if (announcementId && window.pendingAnnouncements.has(announcementId)) {
                clearTimeout(window.pendingAnnouncements.get(announcementId));
                window.pendingAnnouncements.delete(announcementId);
            }

            let cleanMessage = text
                .replace(/안내\s*말씀\s*드립니다[\.!]?\s*/g, '')
                .trim();

            let refinedMessage = cleanMessage
                .replace(/1\s*번/g, '일 번')
                .replace(/2\s*번/g, '이 번')
                .replace(/3\s*번/g, '삼 번')
                .replace(/4\s*번/g, '사 번')
                .replace(/5\s*번/g, '오 번')
                .replace(/6\s*번/g, '육 번')
                .replace(/7\s*번/g, '칠 번')
                .replace(/8\s*번/g, '팔 번')
                .replace(/9\s*번/g, '구 번');

            if (refinedMessage.includes('회원님은')) {
                let parts = refinedMessage.split('회원님은');
                let rawNames = parts[0].trim();
                let spacedNames = rawNames.split(',').map(nameGroup => {
                    return nameGroup.trim().split('').join(' '); 
                }).join(', ');
                refinedMessage = `${spacedNames} 회원님은${parts[1]}`;
            }

            const runSpeech = () => {
                window.speechSynthesis.cancel();
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
                const utterance = new SpeechSynthesisUtterance(refinedMessage);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.93;
                utterance.pitch = 1.0;
                
                const cleanup = () => {
                    if (announcementId) window.pendingAnnouncements.delete(announcementId);
                };
                utterance.onend = cleanup;
                utterance.onerror = cleanup;

                window.speechSynthesis.speak(utterance);
            };

            if (delaySeconds > 0) {
                const timerId = setTimeout(() => {
                    if (announcementId) window.pendingAnnouncements.delete(announcementId);
                    runSpeech();
                }, delaySeconds * 1000);

                if (announcementId) {
                    window.pendingAnnouncements.set(announcementId, timerId);
                }
            } else {
                runSpeech();
            }
        } else {
            console.warn("이 브라우저는 음성 합성을 지원하지 않습니다.");
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatTime(sec) {
        if (sec <= 0 || sec === null || sec === undefined) return "00:00";
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    let previousCourtStates = {};

    socket.on('stateUpdated', (state) => {
        try {
            const courts = state.courtsData || state.courts || [];
            const gameQueue = state.gameQueue || (Array.isArray(state.queues) ? state.queues.filter(q => q.type === 'game') : []);
            const nantaQueue = state.nantaQueue || (Array.isArray(state.queues) ? state.queues.filter(q => q.type === 'nanta') : []);

            if (Array.isArray(courts)) {
                courts.forEach((court, idx) => {
                    if (!court) return;
                    const courtNum = court.id || (idx + 1);

                    let isOccupied = false;
                    if (court.type === 'nanta') {
                        const sideAHas = court.sideA && !court.sideA.isEmpty;
                        const sideBHas = court.sideB && !court.sideB.isEmpty;
                        isOccupied = sideAHas || sideBHas;
                    } else {
                        isOccupied = court.isEmpty === false;
                    }

                    const wasOccupied = previousCourtStates[courtNum] || false;
                    
                    if (isOccupied && !wasOccupied) {
                        console.log(`[취소 시도] ${courtNum}번 코트에 사람이 입장함! cancelVoiceAnnouncement 호출`);
                        if (typeof cancelVoiceAnnouncement === 'function') {
                            cancelVoiceAnnouncement(courtNum);
                            cancelVoiceAnnouncement(String(courtNum));
                            cancelVoiceAnnouncement(Number(courtNum));
                        }
                    }

                    previousCourtStates[courtNum] = isOccupied;
                });
            }

            renderTVCourts(courts);
            renderTVQueues(gameQueue, nantaQueue);
        } catch (err) {
            console.error("stateUpdated 처리 중 오류 발생:", err);
        }
    });

    let alertTimer = null;
    socket.on('courtClearedNotice', (data) => {
        const banner = document.getElementById('court-alert-banner');
        const alertText = document.getElementById('court-alert-text');

        if (banner && alertText) {
            alertText.textContent = data.message;
            if (data.category === 'game') banner.style.backgroundColor = '#2980b9'; 
            else if (data.category === 'nanta') banner.style.backgroundColor = '#e67e22'; 
            else if (data.category === 'lesson') banner.style.backgroundColor = '#8e44ad'; 
            else banner.style.backgroundColor = '#c0392b'; 

            banner.style.display = 'block';
            if (alertTimer) clearTimeout(alertTimer);
            alertTimer = setTimeout(() => { banner.style.display = 'none'; }, 4000);
        }
    });

    socket.on('requestVoiceAnnouncement', (data) => {
        console.log('[Socket Debug] 서버로부터 음성 요청 수신됨:', data);
        const { courtNumber, names, matchType } = data;
        const namesString = names.join(', ');

        const numMap = {
            '1': '일', '2': '이', '3': '삼', '4': '사', 
            '5': '오', '6': '육', '7': '칠', '8': '팔', '9': '구'
        };
        const readableCourtNum = numMap[String(courtNumber)] || courtNumber;

        const announcementText = `${namesString} 회원님은, ${readableCourtNum} 번, ${matchType} 코트로, 입장해 주세요.`;
        
        playVoiceAnnouncement(announcementText, 0, courtNumber);
    });

    function renderTVCourts(courts) {
        const container = document.getElementById('tv-court-grid');
        if (!container) return;

        let html = "";
        courts.forEach((court, idx) => {
            const courtNum = court.id || (idx + 1);
            const courtType = court.type || 'game';
            
            let typeBadge = courtType === 'game' ? '<span class="type-badge badge-game">🏸 게임</span>' :
                            courtType === 'nanta' ? '<span class="type-badge badge-nanta">🏸 난타</span>' :
                            '<span class="type-badge badge-lesson">🏸 레슨</span>';

            let teamsHtml = "";

            if (courtType === 'lesson') {
                const noteText = escapeHtml(court.players || court.note || '레슨 코트 운영 중');
                teamsHtml = `<div class="lesson-text">📢 ${noteText}</div>`;
            } else if (courtType === 'nanta') {
                const sideAEmpty = !court.sideA || court.sideA.isEmpty;
                const sideBEmpty = !court.sideB || court.sideB.isEmpty;

                if (sideAEmpty && sideBEmpty) {
                    teamsHtml = `<div class="empty-text">비어있음</div>`;
                } else {
                    if (!sideAEmpty) {
                        const formattedA = formatPlayersHorizontal(court.sideA.players);
                        const remainSecA = (court.sideA.remainingSeconds !== undefined && court.sideA.remainingSeconds !== null) ? court.sideA.remainingSeconds : 0;
                        let timerStrA = `⏱️ ${formatTime(remainSecA)}`;
                        let isUrgentA = remainSecA <= 60 && remainSecA > 0;
                        if (remainSecA <= 0 && court.sideA.startTime) { timerStrA = `⏱️ 시간초과`; isUrgentA = true; }

                        teamsHtml += `
                            <div class="team-row ${isUrgentA ? 'urgent-flash' : ''}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 4px 6px; margin-bottom: 3px; border-radius: 4px;">
                                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; position: relative;">
                                    <span style="font-size: 13px; color: #ffa500; font-weight: bold;">[A코트]</span>
                                    <span style="font-size: 16px; font-weight: bold; color: #00ff66; position: absolute; right: 0; top: 50%; transform: translateY(-50%);">${timerStrA}</span>
                                </div>
                                <div style="display: flex; gap: 6px; flex-wrap: wrap; width: 100%; padding-right: 60px;">${formattedA}</div>
                            </div>
                        `;
                    }
                    if (!sideBEmpty) {
                        const formattedB = formatPlayersHorizontal(court.sideB.players);
                        const remainSecB = (court.sideB.remainingSeconds !== undefined && court.sideB.remainingSeconds !== null) ? court.sideB.remainingSeconds : 0;
                        let timerStrB = `⏱️ ${formatTime(remainSecB)}`;
                        let isUrgentB = remainSecB <= 60 && remainSecB > 0;
                        if (remainSecB <= 0 && court.sideB.startTime) { timerStrB = `⏱️ 시간초과`; isUrgentB = true; }

                        teamsHtml += `
                            <div class="team-row ${isUrgentB ? 'urgent-flash' : ''}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 4px 6px; border-radius: 4px;">
                                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center; position: relative;">
                                    <span style="font-size: 13px; color: #ffa500; font-weight: bold;">[B코트]</span>
                                    <span style="font-size: 16px; font-weight: bold; color: #00ff66; position: absolute; right: 0; top: 50%; transform: translateY(-50%);">${timerStrB}</span>
                                </div>
                                <div style="display: flex; gap: 6px; flex-wrap: wrap; width: 100%; padding-right: 60px;">${formattedB}</div>
                            </div>
                        `;
                    }
                }
            } else {
                if (court.isEmpty || !court.players) {
                    teamsHtml = `<div class="empty-text">비어있음</div>`;
                } else {
                    const formattedGame = formatPlayersHorizontal(court.players);
                    teamsHtml = `
                        <div class="team-row" style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 4px 6px; border-radius: 4px;">
                            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                                <span style="font-size: 13px; color: #3498db; font-weight: bold;">[게임팀]</span>
                                <span class="timer-text">⏱️ 이용중</span>
                            </div>
                            <div style="display: flex; gap: 6px; flex-wrap: wrap; width: 100%;">${formattedGame}</div>
                        </div>
                    `;
                }
            }

            html += `
                <div class="court-card ${courtType}">
                    <div class="court-title">
                        <span>${courtNum}번 코트</span>
                        ${typeBadge}
                    </div>
                    <div class="team-list">
                        ${teamsHtml}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    
    function renderTVQueues(gameQueue, nantaQueue) {
        const gameContainer = document.getElementById('game-waiting-list');
        const nantaContainer = document.getElementById('nanta-waiting-list');
        if (!gameContainer || !nantaContainer) return;

        const gameCountEl = document.getElementById('game-queue-count');
        const nantaCountEl = document.getElementById('nanta-queue-count');
        if (gameCountEl) gameCountEl.innerText = `(${gameQueue.length}팀)`;
        if (nantaCountEl) nantaCountEl.innerText = `(${nantaQueue.length}팀)`;

        const now = Date.now();
        const buildQueueHTML = (queue) => {
            if (!queue || queue.length === 0) return `<div class="empty-queue-text">대기 중인 팀이 없습니다.</div>`;

            return queue.map((q, idx) => {
                const formattedPlayers = formatPlayersHorizontal(q.players);
                let timeDisplayStr = "⏱️ 대기중";

                if (q.remainingSeconds !== undefined && q.remainingSeconds !== null) {
                    const m = Math.floor(q.remainingSeconds / 60);
                    const s = q.remainingSeconds % 60;
                    timeDisplayStr = q.remainingSeconds > 0 ? `⏱️ 입장제한: ${m}분 ${s < 10 ? '0' : ''}${s}초` : `⏱️ 입장제한: 시간 초과`;
                } else if (q.startTime) {
                    const limitMinutes = q.limitMinutes || q.timeout || 3; 
                    const limitSecTotal = limitMinutes * 60;
                    const elapsedSec = Math.floor((now - q.startTime) / 1000);
                    const remainSec = limitSecTotal - elapsedSec;
                    if (remainSec > 0) {
                        const m = Math.floor(remainSec / 60);
                        const s = remainSec % 60;
                        timeDisplayStr = `⏱️ 입장제한: ${m}분 ${s < 10 ? '0' : ''}${s}초`;
                    } else {
                        timeDisplayStr = `⏱️ 입장제한: 시간 초과`;
                    }
                }

                return `
                    <div class="waiting-card" style="margin-bottom: 6px; width: 100%; display: flex; flex-direction: column; gap: 4px; padding: 8px 12px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                            <span style="color: #66fcf1; font-weight: bold; font-size: 15px;">[대기 ${idx + 1}순위]</span>
                            <span style="font-size: 17px; color: #f39c12; font-weight: bold;">${timeDisplayStr}</span>
                        </div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">${formattedPlayers}</div>
                    </div>
                `;
            }).join('');
        };

        gameContainer.innerHTML = buildQueueHTML(gameQueue);
        nantaContainer.innerHTML = buildQueueHTML(nantaQueue);
    }

    function formatPlayersHorizontal(players) {
        let arr = [];
        if (Array.isArray(players)) {
            arr = players.filter(Boolean).map(p => escapeHtml(p.trim()));
        } else if (typeof players === 'string') {
            arr = players.split(',').map(p => escapeHtml(p.trim())).filter(Boolean);
        }
        if (arr.length === 0) return '';
        return arr.map(player => `<span style="background: #2a344a; padding: 2px 6px; border-radius: 4px; font-size: 16px;">${player}</span>`).join('');
    }
</script>
</body>
