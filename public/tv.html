<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📺 체육관 실시간 종합 현황판</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background-color: #0a0c10; 
        color: #ffffff; 
        padding: 6px 8px; 
        overflow: hidden; 
        height: 100vh; 
        display: flex; 
        flex-direction: column; 
        justify-content: flex-start; 
        gap: 6px; 
    }
    
    /* 1. 상단 타이틀 (시인성 유지 + 세로 여백 최적화) */
    .header { 
        text-align: center; 
        border-bottom: 2px solid #1f293d; 
        padding: 0 0 3px 0; 
        flex-shrink: 0; 
    }
    .header h1 { 
        color: #66fcf1; 
        font-size: clamp(24px, 3.1vh, 36px); 
        line-height: 1.15;
        letter-spacing: 2px; 
    }

    /* 2. 공지사항 마퀴 바 (불필요한 하단 마진 제거) */
    .notice-bar {
        overflow: hidden;
        white-space: nowrap;
        width: 100%;
        background: #161b22;
        border-top: 1px solid #30363d;
        border-bottom: 1px solid #30363d;
        padding: 6px 0;
        flex-shrink: 0;
    }
    .notice-marquee-track {
        display: inline-block;
        padding-left: 100%;
        animation: marquee-scroll 35s linear infinite;
    }
    .notice-marquee-track:hover {
        animation-play-state: paused;
    }
    #tv-notice-text {
        color: #e6edf3;
        font-size: clamp(16px, 1.85vh, 20px);
        font-weight: bold;
    }

    /* 3. 코트 현황 그리드 (1순위 시인성 + 코트 수별 자동 유동 높이) */
    .court-grid { 
        display: grid; 
        grid-template-columns: repeat(4, minmax(0, 1fr)); 
        grid-auto-rows: auto;
        align-content: start;
        gap: 7px; 
        width: 100%; 
        flex: 0 0 auto; 
    }
    
    .court-card { 
        background: #141824; 
        border: 2px solid #232d42; 
        border-radius: 8px; 
        padding: 6px 8px; 
        display: flex; 
        flex-direction: column; 
        justify-content: flex-start; 
        gap: 5px; 
        overflow: hidden; 
        min-height: 165px;
    }

    /* 코트 규모별 밀도 및 원거리 시인성 자동 조절 */
    /* [1~4코트] 1줄 배치: 카드를 시원하게 키워 가독성 극대화 + 하단 대기열 약 65% 확보 */
    .court-grid.density-xl .court-card {
        min-height: clamp(185px, 23vh, 245px);
        padding: 8px 10px;
        gap: 7px;
    }
    .court-grid.density-xl .court-title { font-size: clamp(16px, 1.85vh, 20px); }
    .court-grid.density-xl .type-badge { font-size: 12px; padding: 2px 7px; }
    .court-grid.density-xl .tv-match-label { font-size: 14px; }
    .court-grid.density-xl .timer-text { font-size: 14px; }
    .court-grid.density-xl .tv-player-chip { font-size: clamp(15px, 1.75vh, 19px); padding: 4px 8px; }
    .court-grid.density-xl .empty-text,
    .court-grid.density-xl .lesson-text { font-size: 18px; }

    /* [5~8코트] 2줄 배치: 1순위 코트 영역을 큼직하게 확보 + 하단 대기열 약 45% 확보 */
    .court-grid.density-lg .court-card {
        min-height: clamp(155px, 19.5vh, 205px);
        padding: 6px 8px;
        gap: 5px;
    }
    .court-grid.density-lg .court-title { font-size: clamp(15px, 1.65vh, 18px); }
    .court-grid.density-lg .type-badge { font-size: 11px; padding: 2px 6px; }
    .court-grid.density-lg .tv-match-label { font-size: 13px; }
    .court-grid.density-lg .timer-text { font-size: 13px; }
    .court-grid.density-lg .tv-player-chip { font-size: clamp(14px, 1.55vh, 17px); padding: 3px 7px; }
    .court-grid.density-lg .empty-text,
    .court-grid.density-lg .lesson-text { font-size: 16px; }

    /* [9~12코트] 5~6열 × 2줄 배치: 카드 가로 폭 유지 + 하단 대기열 약 45% 방어 */
    .court-grid.density-md { gap: 6px; }
    .court-grid.density-md .court-card {
        min-height: clamp(150px, 19vh, 200px);
        padding: 5px 6px;
        gap: 4px;
    }
    .court-grid.density-md .court-title { font-size: 14px; }
    .court-grid.density-md .type-badge { font-size: 10.5px; padding: 1px 5px; }
    .court-grid.density-md .tv-match-label { font-size: 12px; }
    .court-grid.density-md .timer-text { font-size: 12px; }
    .court-grid.density-md .tv-player-chip { font-size: 13.5px; padding: 2px 5px; }
    .court-grid.density-md .empty-text,
    .court-grid.density-md .lesson-text { font-size: 14px; }

    /* [13~16코트 이상] 6열 × 3줄 배치: 8열 과다 축소 방지 + 하단 대기열 약 35~38% 확보 */
    .court-grid.density-sm { gap: 5px; }
    .court-grid.density-sm .court-card {
        min-height: clamp(128px, 16vh, 172px);
        padding: 4px 6px;
        gap: 3px;
    }
    .court-grid.density-sm .court-title { font-size: 13px; margin-bottom: 0; }
    .court-grid.density-sm .type-badge { font-size: 10px; padding: 1px 4px; }
    .court-grid.density-sm .tv-match-label { font-size: 11px; }
    .court-grid.density-sm .timer-text { font-size: 11px; }
    .court-grid.density-sm .tv-team-box { padding: 3px 5px; }
    .court-grid.density-sm .tv-player-chip { font-size: 12.5px; padding: 2px 4px; }
    .court-grid.density-sm .empty-text,
    .court-grid.density-sm .lesson-text { font-size: 13px; }
    
    .court-card.game { border-color: #3498db; }
    .court-card.nanta { border-color: #ffa500; }
    .court-card.lesson { border-color: #9b59b6; }

    .court-title { 
        font-size: 15px; 
        font-weight: bold; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        flex-shrink: 0; 
    }
    
    .type-badge { font-size: 11px; padding: 2px 5px; border-radius: 4px; font-weight: bold; display: inline-flex; align-items: center; gap: 3px; }
    .badge-game { background: rgba(52, 152, 219, 0.15); color: #3498db; border: 1px solid #3498db; }
    .badge-nanta { background: rgba(255, 165, 0, 0.15); color: #ffa500; border: 1px solid #ffa500; }
    .badge-lesson { background: rgba(155, 89, 182, 0.15); color: #9b59b6; border: 1px solid #9b59b6; }

    .team-list { 
        display: flex; 
        flex-direction: column; 
        gap: 4px; 
        justify-content: center; 
        flex: 1;
        min-height: 0;
    }
    
    .team-row { 
        background: #1f2538; 
        padding: 4px 6px; 
        border-radius: 5px; 
        font-weight: bold; 
        display: flex; 
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
    }
    .team-row-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
    }
    .tv-match-label { font-size: 13px; color: #66fcf1; font-weight: bold; }
    .tv-team-box {
        display: flex;
        align-items: center;
        width: 100%;
        padding: 4px 6px;
        border-radius: 6px;
        box-sizing: border-box;
    }
    .tv-team-box.team-blue {
        background: rgba(56, 189, 248, 0.16);
        border: 1.5px solid #38bdf8;
    }
    .tv-team-box.team-orange {
        background: rgba(251, 146, 60, 0.16);
        border: 1.5px solid #fb923c;
    }
    .tv-team-players {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        width: 100%;
    }
    .tv-player-chip {
        background: #2a344a;
        padding: 3px 6px;
        border-radius: 4px;
        font-size: 15px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.2;
        white-space: nowrap;
    }
    .tv-player-chip.guest-text {
        color: #38bdf8 !important;
        font-weight: 700;
    }

    .empty-text { text-align: center; color: #52607d; font-size: 15px; font-weight: bold; padding: 8px 0; }
    .lesson-text { text-align: center; color: #d8b4fe; font-size: 15px; font-weight: bold; line-height: 1.3; padding: 8px 4px; word-break: keep-all; }

    .timer-text { font-size: 12px; color: #00ff66; font-weight: bold; white-space: nowrap; }

    .urgent-flash {
        animation: urgentFlash 1s ease-in-out infinite;
        border: 1px solid #ef4444;
    }
    @keyframes urgentFlash {
        0%, 100% { background: rgba(239, 68, 68, 0.18); }
        50% { background: rgba(239, 68, 68, 0.42); }
    }

    /* 4. 하단 대기열 컨테이너 (남은 화면 100% 확장 + 게임 6 : 난타 4 비율) */
    .waiting-container { 
        display: grid; 
        grid-template-columns: 3fr 2fr; 
        gap: 8px; 
        flex: 1 1 auto; 
        min-height: 0; 
        width: 100%;
    }
    .waiting-box { 
        background: #141824; 
        border: 1px solid #232d42; 
        border-radius: 8px; 
        padding: 8px 10px; 
        display: flex; 
        flex-direction: column; 
        overflow: hidden; 
        min-height: 0;
    }
    .waiting-title { 
        font-size: clamp(15px, 1.7vh, 18px); 
        font-weight: bold; 
        margin-bottom: 6px; 
        color: #66fcf1; 
        border-bottom: 1px solid #1f293d; 
        padding-bottom: 4px; 
        display: flex; 
        align-items: center; 
        gap: 6px; 
        flex-shrink: 0; 
    }
    
    /* 게임 대기열: 2열 그리드로 최대한 많은 팀을 깔끔하게 표시 */
    .waiting-list { 
        flex: 1 1 auto; 
        min-height: 0;
        overflow-y: auto; 
        display: grid;
        gap: 6px; 
        align-content: start; 
        padding-right: 2px;
    }
    .waiting-list.game-list-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .waiting-list.nanta-list-grid {
        grid-template-columns: 1fr;
    }
    .waiting-list::-webkit-scrollbar { width: 6px; }
    .waiting-list::-webkit-scrollbar-track { background: #0f1420; border-radius: 4px; }
    .waiting-list::-webkit-scrollbar-thumb { background: #2c3852; border-radius: 4px; }

    .waiting-card { 
        background: #1f2538; 
        border: 1px solid #2f3a52; 
        padding: 6px 9px; 
        border-radius: 6px; 
        color: #ffffff;
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
    }
    .waiting-card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        gap: 6px;
    }
    .waiting-rank {
        color: #66fcf1;
        font-weight: 800;
        font-size: 14px;
        white-space: nowrap;
    }
    .waiting-timer {
        font-size: 14px;
        color: #f39c12;
        font-weight: 700;
        white-space: nowrap;
    }
    .waiting-players-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
        width: 100%;
    }
    .waiting-players-grid .tv-player-chip {
        font-size: clamp(13.5px, 1.45vh, 16px);
        padding: 3px 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .empty-queue-text { 
        grid-column: 1 / -1;
        color: #52607d; 
        font-size: 15px; 
        font-weight: bold; 
        padding: 6px 4px; 
    }

    #tv-cleaning-popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 86vw;
        max-width: 1650px;
        background: rgba(15, 23, 42, 0.96);
        border: 5px solid #38bdf8;
        border-radius: 28px;
        padding: 45px 50px;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(56, 189, 248, 0.4);
        z-index: 99999;
        animation: tvPopupFadeIn 0.35s ease-out;
    }

    #tv-cleaning-popup.cleaning-start {
        border-color: #f59e0b;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(245, 158, 11, 0.5);
    }

    #tv-cleaning-popup.cleaning-end {
        border-color: #10b981;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 50px rgba(16, 185, 129, 0.5);
    }

    .tv-popup-title {
        font-size: 3.4rem;
        font-weight: 900;
        margin-bottom: 25px;
        letter-spacing: -1px;
    }

    .cleaning-start .tv-popup-title { color: #f59e0b; }
    .cleaning-end .tv-popup-title { color: #34d399; }

    .tv-popup-desc {
        font-size: 2.3rem;
        font-weight: 700;
        color: #f8fafc;
        line-height: 1.5;
        word-break: keep-all;
    }

    @keyframes tvPopupFadeIn {
        from { opacity: 0; transform: translate(-50%, -46%) scale(0.96); }
        to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes marquee-scroll {
        0%   { transform: translate(0, 0); }
        100% { transform: translate(-100%, 0); }
    }
    </style>
    <script src="/js/audio.js"></script>
</head>
<body>

<div id="popupModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center;">
    <div style="background:#141824; border: 5px solid #3498db; padding:60px 80px; border-radius:20px; text-align:center; max-width:1200px; width:85%; color: #ffffff; box-shadow: 0 25px 50px rgba(0,0,0,0.8);">
        <h2 id="popupTitle" style="color: #ff4d4d; margin-bottom: 30px; font-size: 55px; font-weight: 900;">대기방 삭제 안내</h2>
        <p id="popupMessage" style="font-size: 42px; color: #ffffff; margin-bottom: 20px; line-height: 1.5; font-weight: bold;"></p>
    </div>
</div>

    <div class="header">
        <h1 id="tv-header-title">체육관 실시간 종합 현황판</h1>
    </div>

    <!-- 📢 흘러가는 마퀴 애니메이션이 적용된 통합 공지 영역 -->
    <div class="notice-bar">
        <div class="notice-marquee-track">
            <span id="tv-notice-text">📢 공지사항을 불러오는 중...</span>
        </div>
    </div>

    <div class="court-grid" id="tv-court-grid"></div>

    <div class="waiting-container">
        <div class="waiting-box">
            <div class="waiting-title"><span style="color:#3498db;">🏸</span> 게임 대기팀 <span id="game-queue-count" style="color:#3498db;">(0팀)</span></div>
            <div class="waiting-list game-list-grid" id="game-waiting-list"></div>
        </div>
        <div class="waiting-box">
            <div class="waiting-title"><span style="color:#ffa500;">🏸</span> 난타 대기팀 <span id="nanta-queue-count" style="color:#ffa500;">(0팀)</span></div>
            <div class="waiting-list nanta-list-grid" id="nanta-waiting-list"></div>
        </div>
    </div>

<script>
// 🏢 [멀티 테넌트] URL 파라미터에서 TV 전광판 대상 클럽 식별 (기본값: 'unjeong')
const urlParams = new URLSearchParams(window.location.search);
const currentClubId = urlParams.get('club') || 'unjeong';
window.currentClubId = currentClubId;

document.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.log("전체 화면 전환 실패:", err);
            });
        }
    }, { once: true });

// 🏢 클럽별 한글 명칭 매핑
const clubNames = {
    'unjeong': '운정배드민턴클럽',
    'daewon': '대원배드민턴클럽'
};

// 🏷️ [추가] 상단 타이틀 및 헤더 클럽명 자동 갱신
function updateTvHeader() {
    // 🏢 1. 브라우저 캐시에서 이전에 저장된 한글 이름 즉시 조회
    const cachedName = localStorage.getItem(`tv_club_name_${currentClubId}`);
    const clubDisplayName = window.currentClubName || 
                            cachedName || 
                            (typeof clubNames !== 'undefined' && clubNames[currentClubId]) || 
                            '';

    // 🏢 2. 서버에서 새 한글 이름을 받았다면 브라우저 캐시에 즉시 영구 보관
    if (window.currentClubName) {
        localStorage.setItem(`tv_club_name_${currentClubId}`, window.currentClubName);
    }

    // 🏢 3. 한글 이름이 아직 없으면 영문 임시값을 띄우지 않고 깔끔하게 기본 타이틀 유지
    if (!clubDisplayName) {
        document.title = '코트 현황판';
        return;
    }

    // 브라우저 탭 타이틀 변경
    document.title = `${clubDisplayName} - 코트 현황판`;

    // 상단 헤더 엘리먼트 텍스트 변경
    const headerTitleEl = document.getElementById('tv-header-title') || 
                          document.getElementById('headerTitle') || 
                          document.querySelector('.header-title') || 
                          document.querySelector('header h1');
    if (headerTitleEl) {
        headerTitleEl.textContent = ` ${clubDisplayName} 코트 현황`;
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateTvHeader);
} else {
    updateTvHeader();
}

// 💡 소켓 접속 시 해당 클럽 룸으로 참여하도록 clubId 쿼리 전달
const socket = io({
    query: {
        club: currentClubId
    }
});

// 💡 [추가] 페이지 로드 시 서버로부터 해당 클럽의 최초 설정값을 받아오기 위한 함수
async function loadInitialConfig() {
    try {
        // 해당 클럽 전용 config API 호출
        const response = await fetch(`/api/config?club=${encodeURIComponent(currentClubId)}`);
        if (response.ok) {
            const data = await response.json();
            window.currentConfig = data;
            console.log(`[TV Config - ${currentClubId}] 최초 설정값 로드 완료:`, window.currentConfig);
        }
    } catch (e) {
        console.log('[TV Config] 최초 설정값 로드 실패, 기본값(전부 허용) 적용');
        window.currentConfig = window.currentConfig || {
            soundEntryNotice: true,
            soundNantaWarning: true,
            soundScheduleNotice: true
        };
    }
}
loadInitialConfig();

// 🎛️ 관리자 모드에서 음성 제어 및 토글을 바꿀 때 실시간으로 설정 동기화 받기
if (typeof socket !== 'undefined') {
    socket.on('syncConfig', (configData) => {
        if (configData) {
            window.currentConfig = configData;
            console.log('[TV Config] 실시간 syncConfig 수신 및 적용:', window.currentConfig);
        }
    });
}

if (typeof window.pendingAnnouncements === 'undefined') {
    window.pendingAnnouncements = new Map();
}

let tvPopupQueue = [];
let isTvPopupShowing = false;

async function loadTvNotice() {
    try {
        // 🏢 해당 클럽 전용 공지사항 요청 파라미터 전달
        const response = await fetch(`/api/notices?club=${encodeURIComponent(currentClubId)}`);
        const notices = await response.json();

        const noticeElement = document.getElementById('tv-notice-text');
        if (noticeElement && notices && notices.length > 0) {
            noticeElement.textContent = `📢 [공지] ${notices[0].title}`;
        } else if (noticeElement) {
            noticeElement.textContent = '📢 등록된 공지사항이 없습니다.';
        }
    } catch (error) {
        console.error('❌ TV 공지 로드 실패:', error);
    }
}

loadTvNotice();

if (typeof socket !== 'undefined') {
    socket.on('noticeUpdated', (newNotice) => {
        const noticeElement = document.getElementById('tv-notice-text');
        if (noticeElement && newNotice) {
            noticeElement.textContent = `📢 [공지] ${newNotice.title}`;
        }
    });
}

function cancelVoiceAnnouncement(announcementId) {
    if (!announcementId) return;

    const possibleKeys = [
        announcementId,
        String(announcementId),
        Number(announcementId)
    ];

    possibleKeys.forEach(key => {
        if (window.pendingAnnouncements.has(key)) {
            clearTimeout(window.pendingAnnouncements.get(key));
            window.pendingAnnouncements.delete(key);
            console.log(`[방송 취소 완료] 코트 ID (${key})의 30초 대기 방송이 성공적으로 취소되었습니다.`);
        }
    });
}

let popupTimer = null;
function processTvPopupQueue() {
    if (isTvPopupShowing || tvPopupQueue.length === 0) return;

    isTvPopupShowing = true;
    const popupData = tvPopupQueue.shift();

    const modal = document.getElementById('popupModal');
    const title = document.getElementById('popupTitle');
    const msg = document.getElementById('popupMessage');

    if (modal && title && msg) {
        if (popupData.matchType === '난타임박') {
            title.innerText = `[난타 이용 시간 임박]`;
            msg.innerHTML = popupData.message;
        } else if (popupData.matchType.includes('입장요청')) {
            title.innerText = `[${popupData.matchType}]`;
            msg.innerHTML = popupData.message;
        } else {
            title.innerText = `[${popupData.matchType} 대기방 삭제]`;
            msg.innerHTML = `<strong>${popupData.names.join(', ')}</strong> 팀<br>${popupData.message}`;
        }
        
        modal.style.display = 'flex';

        if (popupTimer) clearTimeout(popupTimer);
        popupTimer = setTimeout(() => {
            modal.style.display = 'none';
            isTvPopupShowing = false;
            setTimeout(processTvPopupQueue, 500); 
        }, 10000); 
    } else {
        isTvPopupShowing = false;
    }
}

function enqueueTvPopup(popupObj) {
    tvPopupQueue.push(popupObj);
    processTvPopupQueue();
}

// ==========================================
// 📺 TV 화면 소켓 등록 및 실시간 이벤트 제어 (중복 선언 방어형)
// ==========================================

// 💡 1. TV 등록 및 룸(Room) 동시 접속 통합 함수
function registerCurrentTV() {
    if (!socket || !socket.connected) return;

    const targetClub = (typeof currentClubId !== 'undefined' && currentClubId) || 'unjeong';

    console.log(`[TV Socket] TV 등록 및 룸 조인 시도 - 구장: ${targetClub}`);

    // A. 기존 TV 식별 이벤트 전송
    socket.emit('registerTV', { clubId: targetClub });

    // B. 설정 동기화 룸 및 TV 전용 음성 안내 룸 동시 접속
    socket.emit('joinRoom', `club_${targetClub}`);
    socket.emit('joinRoom', `tv-room-${targetClub}`);
}

// 💡 2. 최초 로드 시 연결 상태 확인 및 재연결 이벤트 바인딩
if (socket.connected) {
    registerCurrentTV();
}

socket.on('connect', () => {
    registerCurrentTV();
});

// 💡 3. TV 팝업 알림 수신 (타 구장 데이터 유입 차단 가드)
socket.on('tvPopupAlert', (data) => {
    if (!data) return;

    const targetClub = (typeof currentClubId !== 'undefined' && currentClubId) || 'unjeong';
    if (data.clubId && data.clubId !== targetClub) {
        console.warn(`[TV Popup Ignored] 타 구장(${data.clubId}) 팝업 수신 차단`);
        return;
    }

    enqueueTvPopup({
        matchType: data.matchType,
        names: data.names,
        message: data.message
    });
});

    socket.off('entryPopupAlert').on('entryPopupAlert', (data) => {
        // 💡 0초에 발송되는 스마트폰 전용 알림(target: 'mobile')은 TV에서 무시
        if (data && data.target === 'mobile') return;

        const targetNames = (data.targetPlayers && Array.isArray(data.targetPlayers)) ? data.targetPlayers.join(', ') : '';
        
        enqueueTvPopup({
            matchType: `${data.matchType || '게임'} 코트 입장요청`,
            names: data.targetPlayers || [],
            message: `<strong>${targetNames}</strong> 회원님!<br>지금 <strong>[${data.courtNumber}번 ${data.matchType} 코트]</strong>로 입장해 주세요!`
        });
    });

   // 💡 1~9번 및 10번 이후 코트 번호까지 '번' 누락 없이 완벽하게 읽어주는 변환 함수
    function getReadableCourtName(courtNum) {
        if (!courtNum) return '';
        const num = parseInt(courtNum, 10);
        const baseMap = { 1: '일', 2: '이', 3: '삼', 4: '사', 5: '오', 6: '육', 7: '칠', 8: '팔', 9: '구' };
        
        if (num >= 1 && num <= 9) {
            return `${baseMap[num]} 번`;
        } else if (num >= 10 && num <= 19) {
            if (num === 10) return '십 번';
            return `십${baseMap[num - 10]} 번`;
        } else if (num >= 20 && num <= 29) {
            if (num === 20) return '이십 번';
            return `이십${baseMap[num - 20]} 번`;
        }
        return `${num} 번`;
    }

    // 💡 [발음 교정 사전] TTS가 이상하게 발음하는 이름이나 단어를 여기에 추가하면 소리만 자연스럽게 교정됩니다.
    const CUSTOM_PRONUNCIATION_DICT = {
        '김진희': '김진히',
        '진희': '진히',
        '박희수': '박히수',
        '이희진': '이히진',
    };

    function playVoiceAnnouncement(text, delaySeconds = 0, announcementId = null) {
        if ('speechSynthesis' in window) {
            if (announcementId && window.pendingAnnouncements.has(announcementId)) {
                clearTimeout(window.pendingAnnouncements.get(announcementId));
                window.pendingAnnouncements.delete(announcementId);
            }

            let cleanMessage = text
                .replace(/안내\s*말씀\s*드립니다[\.!]?\s*/g, '')
                .trim();

            // 💡 1. 사용자 정의 발음 교정 사전 우선 적용 (예: 김진희 -> 김진히)
            Object.keys(CUSTOM_PRONUNCIATION_DICT).forEach(wrongWord => {
                const rightSound = CUSTOM_PRONUNCIATION_DICT[wrongWord];
                cleanMessage = cleanMessage.split(wrongWord).join(rightSound);
            });

            // 💡 2. 10~16번이 '1일 번'으로 쪼개지지 않도록 두 자리 숫자부터 먼저 한글로 치환
            let refinedMessage = cleanMessage
                .replace(/16\s*번/g, '십육 번')
                .replace(/15\s*번/g, '십오 번')
                .replace(/14\s*번/g, '십사 번')
                .replace(/13\s*번/g, '십삼 번')
                .replace(/12\s*번/g, '십이 번')
                .replace(/11\s*번/g, '십일 번')
                .replace(/10\s*번/g, '십 번')
                .replace(/1\s*번/g, '일 번')
                .replace(/2\s*번/g, '이 번')
                .replace(/3\s*번/g, '삼 번')
                .replace(/4\s*번/g, '사 번')
                .replace(/5\s*번/g, '오 번')
                .replace(/6\s*번/g, '육 번')
                .replace(/7\s*번/g, '칠 번')
                .replace(/8\s*번/g, '팔 번')
                .replace(/9\s*번/g, '구 번');

            // 💡 3. 공지/청소 안내문은 문장이 글자별로 쪼개지지 않도록 보호
            const isNoticeBroadcast = (announcementId === 'broadcast-cleaning') || 
                                      refinedMessage.includes('청소') || 
                                      refinedMessage.includes('휴장') || 
                                      refinedMessage.includes('정비');

            if (!isNoticeBroadcast && (refinedMessage.includes('회원님은') || refinedMessage.includes('회원님!'))) {
                const delimiter = refinedMessage.includes('회원님은') ? '회원님은' : '회원님!';
                let parts = refinedMessage.split(delimiter);
                let rawNames = parts[0].trim();
                if (rawNames.length <= 30 && !rawNames.includes('.')) {
                    let spacedNames = rawNames.split(',').map(nameGroup => {
                        return nameGroup.trim().split('').join(' '); 
                    }).join(', ');
                    refinedMessage = `${spacedNames} ${delimiter}${parts[1]}`;
                }
            }

            const runSpeech = () => {
                window.speechSynthesis.cancel();
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
                const utterance = new SpeechSynthesisUtterance(refinedMessage);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.93;
                utterance.pitch = 1.0;
                
                const cleanup = () => {
                    if (announcementId) window.pendingAnnouncements.delete(announcementId);
                };
                utterance.onend = cleanup;
                utterance.onerror = cleanup;

                window.speechSynthesis.speak(utterance);
            };

            if (delaySeconds > 0) {
                const timerId = setTimeout(() => {
                    if (announcementId) window.pendingAnnouncements.delete(announcementId);
                    runSpeech();
                }, delaySeconds * 1000);

                if (announcementId) {
                    window.pendingAnnouncements.set(announcementId, timerId);
                }
            } else {
                runSpeech();
            }
        } else {
            console.warn("이 브라우저는 음성 합성을 지원하지 않습니다.");
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatTime(sec) {
        if (sec <= 0 || sec === null || sec === undefined) return "00:00";
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    let previousCourtStates = {};

    // 💡 전역 설정 객체 초기화
    window.currentConfig = window.currentConfig || {};

    // ⏱️ TV 전광판 로컬 1초 카운트다운 엔진 (난타 60초 점멸 및 입장제한 실시간 반영)
    if (!window._tvCountdownInitialized) {
        window._tvCountdownInitialized = true;
        window._tvLastSyncAt = Date.now();
        window._tvIsCleaningTime = false;
        window._tvLatestCourts = [];
        window._tvLatestGameQueue = [];
        window._tvLatestNantaQueue = [];

        setInterval(() => {
            if (window._tvIsCleaningTime) return;

            const elapsedSec = Math.max(0, Math.floor((Date.now() - (window._tvLastSyncAt || Date.now())) / 1000));
            let hasCourtTimer = false;
            let hasQueueTimer = false;

            (window._tvLatestCourts || []).forEach(court => {
                if (court && court.type === 'nanta') {
                    ['sideA', 'sideB'].forEach(side => {
                        if (court[side] && !court[side].isEmpty && typeof court[side]._baseRemainingSeconds === 'number') {
                            court[side].remainingSeconds = Math.max(0, court[side]._baseRemainingSeconds - elapsedSec);
                            hasCourtTimer = true;
                        }
                    });
                }
            });

            [...(window._tvLatestGameQueue || []), ...(window._tvLatestNantaQueue || [])].forEach(q => {
                if (q && typeof q._baseRemainingSeconds === 'number') {
                    q.remainingSeconds = Math.max(0, q._baseRemainingSeconds - elapsedSec);
                    hasQueueTimer = true;
                }
            });

            if (hasCourtTimer && typeof renderTVCourts === 'function') {
                renderTVCourts(window._tvLatestCourts);
            }
            if (hasQueueTimer && typeof renderTVQueues === 'function') {
                renderTVQueues(window._tvLatestGameQueue, window._tvLatestNantaQueue);
            }
        }, 1000);
    }

    // 1. 서버 상태 업데이트 및 설정 동기화 수신
    socket.on('stateUpdated', (state) => {
        try {
            if (typeof previousCourtStates === 'undefined') {
                window.previousCourtStates = {};
            }

            window._tvLastSyncAt = Date.now();
            window._tvIsCleaningTime = Boolean(state && state.isCleaningTime);

            if (state && state.config) {
                window.currentConfig = state.config;
            } else if (state && state.courtsData && state.courtsData.config) {
                window.currentConfig = state.courtsData.config;
            }

            // 🏢 [클럽명 수신] 서버에서 전달된 한글 클럽명 저장 및 헤더 갱신
            if (state && (state.clubName || state.name)) {
                window.currentClubName = state.clubName || state.name;
                if (typeof updateTvHeader === 'function') {
                    updateTvHeader();
                }
            }

            const courts = state.courtsData || state.courts || [];
            const gameQueue = state.gameQueue || (Array.isArray(state.queues) ? state.queues.filter(q => q.type === 'game') : []);
            const nantaQueue = state.nantaQueue || (Array.isArray(state.queues) ? state.queues.filter(q => q.type === 'nanta') : []);

            // 로컬 카운트다운 기준 초 스냅샷 저장
            courts.forEach(c => {
                if (c && c.type === 'nanta') {
                    ['sideA', 'sideB'].forEach(side => {
                        if (c[side] && !c[side].isEmpty && typeof c[side].remainingSeconds === 'number') {
                            c[side]._baseRemainingSeconds = c[side].remainingSeconds;
                        }
                    });
                }
            });
            [...gameQueue, ...nantaQueue].forEach(q => {
                q._baseRemainingSeconds = (typeof q.remainingSeconds === 'number') ? q.remainingSeconds : null;
            });

            window._tvLatestCourts = courts;
            window._tvLatestGameQueue = gameQueue;
            window._tvLatestNantaQueue = nantaQueue;

            // 💡 [코트운영설정 자동 로드]
            if (!window.isCourtConfigLoaded && Array.isArray(courts) && courts.length > 0) {
                if (typeof localCourts !== 'undefined') {
                    localCourts = courts.map(c => ({
                        type: c.type || 'game',
                        note: (c.type === 'lesson' ? (c.players || c.note || '') : (c.note || ''))
                    }));
                    if (typeof renderCourtConfig === 'function') {
                        renderCourtConfig();
                    }
                }
                window.isCourtConfigLoaded = true;
            }

            if (Array.isArray(courts)) {
                courts.forEach((court, idx) => {
                    if (!court) return;
                    const courtNum = court.id || (idx + 1);

                    let isOccupied = false;
                    if (court.type === 'nanta') {
                        const sideAHas = court.sideA && !court.sideA.isEmpty;
                        const sideBHas = court.sideB && !court.sideB.isEmpty;
                        isOccupied = sideAHas || sideBHas;
                    } else {
                        isOccupied = court.isEmpty === false;
                    }

                    const wasOccupied = previousCourtStates[courtNum] || false;
                    
                    if (isOccupied && !wasOccupied) {
                        if (typeof cancelVoiceAnnouncement === 'function') {
                            cancelVoiceAnnouncement(courtNum);
                            cancelVoiceAnnouncement(String(courtNum));
                            cancelVoiceAnnouncement(Number(courtNum));
                        }
                    }

                    previousCourtStates[courtNum] = isOccupied;
                });
            }

            if (typeof renderTVCourts === 'function') renderTVCourts(courts);
            if (typeof renderTVQueues === 'function') renderTVQueues(gameQueue, nantaQueue);
        } catch (err) {
            console.error("stateUpdated 처리 중 오류 발생:", err);
        }
    });

    // 2. 관리자 모드 토글 변경 시 실시간 설정 동기화 수신
    socket.on('syncConfig', (configData) => {
        if (configData) {
            window.currentConfig = configData;
            console.log('[TV Config] 실시간 syncConfig 수신 및 적용:', window.currentConfig);
        }
    });

    let alertTimer = null;
    socket.on('courtClearedNotice', (data) => {
        const banner = document.getElementById('court-alert-banner');
        const alertText = document.getElementById('court-alert-text');

        if (banner && alertText) {
            alertText.textContent = data.message;
            if (data.category === 'game') banner.style.backgroundColor = '#2980b9'; 
            else if (data.category === 'nanta') banner.style.backgroundColor = '#e67e22'; 
            else if (data.category === 'lesson') banner.style.backgroundColor = '#8e44ad'; 
            else banner.style.backgroundColor = '#c0392b'; 

            banner.style.display = 'block';
            if (alertTimer) clearTimeout(alertTimer);
            alertTimer = setTimeout(() => { banner.style.display = 'none'; }, 4000);
        }
    });

    let tvCleanTimer = null;
    socket.on('tvCleaningAlert', (data) => {
        const popup = document.getElementById('tv-cleaning-popup');
        const titleEl = document.getElementById('tv-clean-title');
        const descEl = document.getElementById('tv-clean-desc');

        if (!popup || !titleEl || !descEl) return;

        titleEl.textContent = data.title || '🧹 구장 청소 안내';
        descEl.innerHTML = (data.message || '').replace(/\n/g, '<br>');

        popup.className = (data.type === 'start') ? 'cleaning-start' : 'cleaning-end';
        popup.style.display = 'block';

        if (tvCleanTimer) clearTimeout(tvCleanTimer);
        tvCleanTimer = setTimeout(() => {
            popup.style.display = 'none';
        }, data.duration || 60000);
    });

    // 3. 서버로부터 음성 요청을 받았을 때 토글 상태를 확인하여 제어하는 핵심 리스너
    socket.on('requestVoiceAnnouncement', (data) => {
        console.log('[Socket Debug] 서버로부터 음성 요청 수신됨:', data);
        if (!data) return;

        const config = window.currentConfig || {};

        // A. 청소, 휴장, 공지 또는 난타 1분 전 방송인 경우
        if (data.matchType === '공지' || data.matchType === '난타1분전' || data.isBroadcast || data.message) {
            const broadcastText = data.message || '구장 청소 및 정비 시간입니다. 잠시 코트 이용을 중단해 주시기 바랍니다.';
            
            const isCleaningNotice = broadcastText.includes('청소') || broadcastText.includes('휴장') || broadcastText.includes('정비') || data.matchType === '공지';
            const isNantaWarning = data.matchType === '난타1분전' || broadcastText.includes('난타');

            let allowVoice = true;

            if (isCleaningNotice && config.soundScheduleNotice === false) {
                console.log('[TV Audio Block] 🚫 청소/휴장 안내 음성 차단됨');
                allowVoice = false;
            }

            if (isNantaWarning && config.soundNantaWarning === false) {
                console.log('[TV Audio Block] 🚫 난타 경고 음성 차단됨');
                allowVoice = false;
            }

            if (allowVoice) {
                playVoiceAnnouncement(broadcastText, 0, 'broadcast-cleaning');
            }

            if (data.matchType === '난타1분전') {
                enqueueTvPopup({
                    matchType: '난타임박',
                    names: [],
                    message: `⏰ <strong>${broadcastText}</strong>`
                });
            }

            return; 
        }

        // B. 코트 입장 안내 토글 검사
        if (config.soundEntryNotice === false) {
            console.log('[TV Audio Block] 🚫 입장 안내 토글 꺼짐으로 코트 입장 방송 차단됨');
            return;
        }

        const { courtNumber, names, matchType } = data;
        const namesString = (names && Array.isArray(names)) ? names.join(', ') : (names || '');
        const readableCourtNum = getReadableCourtName(courtNumber);

        const announcementText = `${namesString} 회원님! 지금 ${readableCourtNum} ${matchType || '게임'} 코트로 입장해 주세요!`;
        
        playVoiceAnnouncement(announcementText, 0, courtNumber);
    });

    // 📐 코트 수에 따라 시인성 최우선 그리드(열 수 + 밀도 클래스) 자동 결정
    function applyCourtGridLayout(container, courtCount) {
        const count = Math.max(1, Number(courtCount) || 1);
        let cols = 4;
        let densityClass = 'density-lg';

        if (count <= 4) {
            cols = count;          // 1~4코트: 1줄 꽉 채움 (대형 시인성)
            densityClass = 'density-xl';
        } else if (count <= 6) {
            cols = 3;              // 5~6코트: 3열 × 2줄 (빈칸 최소화 + 대형 카드)
            densityClass = 'density-lg';
        } else if (count <= 8) {
            cols = 4;              // 7~8코트: 4열 × 2줄
            densityClass = 'density-lg';
        } else if (count <= 10) {
            cols = 5;              // 9~10코트: 5열 × 2줄
            densityClass = 'density-md';
        } else if (count <= 12) {
            cols = 6;              // 11~12코트: 6열 × 2줄
            densityClass = 'density-md';
        } else {
            cols = 6;              // 13~16코트 이상: 6열 × 3줄 (가로 폭 보호로 가독성 유지)
            densityClass = 'density-sm';
        }

        container.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        container.classList.remove('density-xl', 'density-lg', 'density-md', 'density-sm');
        container.classList.add(densityClass);
    }

    function renderTVCourts(courts) {
        const container = document.getElementById('tv-court-grid');
        if (!container) return;

        const safeCourts = Array.isArray(courts) ? courts : [];
        applyCourtGridLayout(container, safeCourts.length);

        let html = "";
        safeCourts.forEach((court, idx) => {
            const courtNum = court.id || (idx + 1);
            const courtType = court.type || 'game';
            
            let typeBadge = courtType === 'game' ? '<span class="type-badge badge-game">🏸 게임</span>' :
                            courtType === 'nanta' ? '<span class="type-badge badge-nanta">🏸 난타</span>' :
                            '<span class="type-badge badge-lesson">🏸 레슨</span>';

            let teamsHtml = "";

            if (courtType === 'lesson') {
                const noteText = escapeHtml(court.players || court.note || '레슨 코트 운영 중');
                teamsHtml = `<div class="lesson-text">📢 ${noteText}</div>`;
            } else if (courtType === 'nanta') {
                const sideAEmpty = !court.sideA || court.sideA.isEmpty;
                const sideBEmpty = !court.sideB || court.sideB.isEmpty;

                if (sideAEmpty && sideBEmpty) {
                    teamsHtml = `<div class="empty-text">비어있음</div>`;
                } else {
                    if (!sideAEmpty) {
                        const formattedA = formatPlayersHorizontal(court.sideA.players);
                        const remainSecA = (court.sideA.remainingSeconds !== undefined && court.sideA.remainingSeconds !== null) ? court.sideA.remainingSeconds : 0;
                        let timerStrA = `⏱️ ${formatTime(remainSecA)}`;
                        let isUrgentA = remainSecA <= 60 && remainSecA > 0;
                        if (remainSecA <= 0 && court.sideA.startTime) { timerStrA = `⏱️ 시간초과`; isUrgentA = true; }

                        teamsHtml += `
                            <div class="team-row ${isUrgentA ? 'urgent-flash' : ''}">
                                <div class="team-row-head">
                                    <span class="tv-match-label" style="color: #ffa500;">[A코트]</span>
                                    <span class="timer-text">${timerStrA}</span>
                                </div>
                                <div class="tv-team-players">${formattedA}</div>
                            </div>
                        `;
                    }
                    if (!sideBEmpty) {
                        const formattedB = formatPlayersHorizontal(court.sideB.players);
                        const remainSecB = (court.sideB.remainingSeconds !== undefined && court.sideB.remainingSeconds !== null) ? court.sideB.remainingSeconds : 0;
                        let timerStrB = `⏱️ ${formatTime(remainSecB)}`;
                        let isUrgentB = remainSecB <= 60 && remainSecB > 0;
                        if (remainSecB <= 0 && court.sideB.startTime) { timerStrB = `⏱️ 시간초과`; isUrgentB = true; }

                        teamsHtml += `
                            <div class="team-row ${isUrgentB ? 'urgent-flash' : ''}">
                                <div class="team-row-head">
                                    <span class="tv-match-label" style="color: #ffa500;">[B코트]</span>
                                    <span class="timer-text">${timerStrB}</span>
                                </div>
                                <div class="tv-team-players">${formattedB}</div>
                            </div>
                        `;
                    }
                }
            } else {
                if (court.isEmpty || !court.players) {
                    teamsHtml = `<div class="empty-text">비어있음</div>`;
                } else if (court.teams && Array.isArray(court.teams.teamA) && court.teams.teamA.length > 0 && Array.isArray(court.teams.teamB) && court.teams.teamB.length > 0) {
                    // ⚖️ 자동 밸런싱 팀 구분 표시 (블루 / 오렌지 색상 박스, A팀·B팀 텍스트 제거)
                    const formattedTeamA = formatPlayersHorizontal(court.teams.teamA.join(', '));
                    const formattedTeamB = formatPlayersHorizontal(court.teams.teamB.join(', '));
                    const recommendedType = court.teams.matchType || (court.teams.isMixedDoubles ? '혼복' : '자유');
                    const matchLabel = `[추천 ${recommendedType}]`;

                    teamsHtml = `
                        <div class="team-row">
                            <div class="team-row-head">
                                <span class="tv-match-label">${matchLabel}</span>
                                <span class="timer-text">⏱️ 이용중</span>
                            </div>
                            <div class="tv-team-box team-blue">
                                <div class="tv-team-players">${formattedTeamA}</div>
                            </div>
                            <div class="tv-team-box team-orange">
                                <div class="tv-team-players">${formattedTeamB}</div>
                            </div>
                        </div>
                    `;
                } else {
                    const formattedGame = formatPlayersHorizontal(court.players);
                    teamsHtml = `
                        <div class="team-row">
                            <div class="team-row-head">
                                <span class="tv-match-label" style="color: #3498db;">[게임팀]</span>
                                <span class="timer-text">⏱️ 이용중</span>
                            </div>
                            <div class="tv-team-players">${formattedGame}</div>
                        </div>
                    `;
                }
            }

            html += `
                <div class="court-card ${courtType}">
                    <div class="court-title">
                        <span>${courtNum}번 코트</span>
                        ${typeBadge}
                    </div>
                    <div class="team-list">
                        ${teamsHtml}
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    
    function renderTVQueues(gameQueue, nantaQueue) {
        const gameContainer = document.getElementById('game-waiting-list');
        const nantaContainer = document.getElementById('nanta-waiting-list');
        if (!gameContainer || !nantaContainer) return;

        const safeGameQueue = Array.isArray(gameQueue) ? gameQueue : [];
        const safeNantaQueue = Array.isArray(nantaQueue) ? nantaQueue : [];

        const gameCountEl = document.getElementById('game-queue-count');
        const nantaCountEl = document.getElementById('nanta-queue-count');
        if (gameCountEl) gameCountEl.innerText = `(${safeGameQueue.length}팀)`;
        if (nantaCountEl) nantaCountEl.innerText = `(${safeNantaQueue.length}팀)`;

        const now = Date.now();
        const buildQueueHTML = (queue) => {
            if (!queue || queue.length === 0) return `<div class="empty-queue-text">대기 중인 팀이 없습니다.</div>`;

            return queue.map((q, idx) => {
                const formattedPlayers = formatPlayersHorizontal(q.players);
                let timeDisplayStr = "⏱️ 대기중";

                if (q.remainingSeconds !== undefined && q.remainingSeconds !== null) {
                    const m = Math.floor(q.remainingSeconds / 60);
                    const s = q.remainingSeconds % 60;
                    timeDisplayStr = q.remainingSeconds > 0 ? `⏱️ 입장제한 ${m}분 ${s < 10 ? '0' : ''}${s}초` : `⏱️ 시간 초과`;
                } else if (q.startTime) {
                    const limitMinutes = q.limitMinutes || q.timeout || 3; 
                    const limitSecTotal = limitMinutes * 60;
                    const elapsedSec = Math.floor((now - q.startTime) / 1000);
                    const remainSec = limitSecTotal - elapsedSec;
                    if (remainSec > 0) {
                        const m = Math.floor(remainSec / 60);
                        const s = remainSec % 60;
                        timeDisplayStr = `⏱️ 입장제한 ${m}분 ${s < 10 ? '0' : ''}${s}초`;
                    } else {
                        timeDisplayStr = `⏱️ 시간 초과`;
                    }
                }

                return `
                    <div class="waiting-card">
                        <div class="waiting-card-head">
                            <span class="waiting-rank">[대기 ${idx + 1}순위]</span>
                            <span class="waiting-timer">${timeDisplayStr}</span>
                        </div>
                        <div class="waiting-players-grid">${formattedPlayers}</div>
                    </div>
                `;
            }).join('');
        };

        gameContainer.innerHTML = buildQueueHTML(safeGameQueue);
        nantaContainer.innerHTML = buildQueueHTML(safeNantaQueue);
    }

    function formatPlayersHorizontal(players) {
        let arr = [];
        if (Array.isArray(players)) {
            arr = players.filter(Boolean);
        } else if (typeof players === 'string') {
            arr = players.split(',').map(p => p.trim()).filter(Boolean);
        }
        
        if (arr.length === 0) return '';

        return arr.map(p => {
            let rawStr = String(p).trim();

            // 🎯 일일회원 판별: |guest 마커가 있거나 '일일' 키워드가 들어있는 경우
            const isGuestUser = rawStr.includes('guest') || rawStr.includes('일일');

            // 💡 화면 출력 시 숨김 마커(|guest) 제거 및 일일회원 '일반' -> '일일' 보정
            let cleanStr = rawStr.replace(/\|?guest/gi, '').trim();
            if (cleanStr.includes('/')) {
                const parts = cleanStr.split('/').map(part => part.trim()).filter(Boolean);
                if (isGuestUser && parts.length >= 2 && parts[parts.length - 1] === '일반') {
                    parts[parts.length - 1] = '일일';
                }
                cleanStr = parts.join(' / ');
            }

            const guestClass = isGuestUser ? 'guest-text' : '';

            return `<span class="tv-player-chip ${guestClass}">${escapeHtml(cleanStr)}</span>`;
        }).join(' ');
    }
</script>

<div id="tv-cleaning-popup">
    <div id="tv-clean-title" class="tv-popup-title">🧹 구장 청소 시간</div>
    <div id="tv-clean-desc" class="tv-popup-desc">안내 메시지가 여기에 표시됩니다.</div>
</div>
