<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘민턴 - 마스터 슈퍼 관리자</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-orange: #ff6600;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .header h1 { font-size: 22px; color: var(--accent-orange); display: flex; align-items: center; gap: 8px; }
        .grid-container {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 24px;
        }
        @media (max-width: 860px) {
            .grid-container { grid-template-columns: 1fr; }
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 20px;
        }
        .card h2 { font-size: 17px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: #ffffff;
            font-size: 14px;
        }
        .form-control:focus { outline: none; border-color: var(--accent-orange); }
        .btn-submit {
            width: 100%;
            background-color: var(--accent-orange);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.9; }
        .club-list { display: flex; flex-direction: column; gap: 14px; }
        .club-item {
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .club-info h3 { font-size: 16px; margin-bottom: 4px; }
        .club-meta { font-size: 12px; color: var(--text-sub); display: flex; gap: 12px; }
        .club-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn-user { background: #2563eb; color: #fff; }
        .btn-tv { background: #059669; color: #fff; }
        .btn-admin { background: #4b5563; color: #fff; }
        .btn-delete { background: #dc2626; color: #fff; }

        /* 인증 모달 */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: var(--card-bg); border-radius: 12px; padding: 24px; width: 340px; text-align: center;
            border: 1px solid var(--border-color);
        }
        .modal-box input { margin: 16px 0; text-align: center; font-size: 18px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <!-- 마스터 비밀번호 인증 창 -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 style="font-size: 18px; color: #ff6600;">👑 슈퍼 관리자 인증</h2>
            <p style="font-size: 12px; color: #aaa; margin-top: 6px;">마스터 비밀번호를 입력해 주세요.</p>
            <input type="password" id="master-password" class="form-control" placeholder="비밀번호 입력" autofocus>
            <button class="btn-submit" onclick="verifyLogin()">인증 및 접속</button>
        </div>
    </div>

    <!-- 기존 auth-modal 모달 영역 끝부분 바로 아래 -->
<script>
  // ⚡ 화면이 브라우저에 렌더링되기 전에 세션 키가 있으면 모달 즉시 숨김
  if (sessionStorage.getItem('superAdminKey')) {
    const modalEl = document.getElementById('auth-modal');
    if (modalEl) modalEl.style.display = 'none';
  }
</script>

    <div class="header">
        <h1>👑 오늘민턴 플랫폼 마스터 관리자</h1>
        <div style="font-size: 13px; color: #aaa;" id="status-text">서버 연결 중...</div>
    </div>

    <div class="grid-container">
        <!-- 1. 새 클럽 생성 폼 -->
        <div class="card">
            <h2>➕ 신규 클럽 등록</h2>
            <form id="create-club-form" onsubmit="handleCreateClub(event)">
                <div class="form-group">
                    <label>클럽 영문 ID (URL 주소용)</label>
                    <input type="text" id="new-club-id" class="form-control" placeholder="예: paju, daewon" required pattern="[a-zA-Z0-9_-]+">
                    <small style="color: #666; font-size: 11px;">영문 소문자/숫자만 사용 (/?club=아이디 로 접속됨)</small>
                </div>
                <div class="form-group">
                    <label>클럽 명칭 (표시 이름)</label>
                    <input type="text" id="new-club-name" class="form-control" placeholder="예: 파주배드민턴클럽" required>
                </div>
                <div class="form-group">
                    <label>코트 총 개수</label>
                    <input type="number" id="new-club-courts" class="form-control" value="6" min="2" max="20" required>
                    <small style="color: #666; font-size: 11px;">마지막 2코트는 난타 및 레슨 코트로 자동 구성됩니다.</small>
                </div>
                <div class="form-group">
                    <label>해당 클럽 관리자 비밀번호</label>
                    <input type="text" id="new-club-password" class="form-control" value="1234" required>
                </div>
                <button type="submit" class="btn-submit">클럽 자동 생성 및 즉시 활성화</button>
            </form>
        </div>

        <!-- 2. 등록된 클럽 현황 및 바로가기 -->
        <div class="card">
            <h2>🏢 운영 중인 클럽 목록 (<span id="club-count">0</span>개)</h2>
            <div id="club-list" class="club-list">
                <div style="color: #666; text-align: center; padding: 40px;">불러오는 중...</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let masterPassword = '';

       function verifyLogin(autoPassword = null) {
    const passInput = autoPassword || (document.getElementById('master-password') ? document.getElementById('master-password').value : '');
    if (!passInput) return alert('비밀번호를 입력하세요.');

    socket.emit('superAdmin:getClubs', passInput, (res) => {
        if (res.success) {
            masterPassword = passInput;
            // 🔑 새로고침(F5) 시 세션 유지를 위해 세션 스토리지에 저장
            sessionStorage.setItem('superAdminKey', passInput);

            const authModal = document.getElementById('auth-modal');
            if (authModal) authModal.style.display = 'none';

            const statusText = document.getElementById('status-text');
            if (statusText) statusText.innerText = '🟢 마스터 세션 인증됨';

            renderClubList(res.clubs);
        
        } else {
            // ❌ 인증 실패 시 세션 키 삭제 및 모달 다시 표시
            sessionStorage.removeItem('superAdminKey');
            
            const authModal = document.getElementById('auth-modal');
            if (authModal) authModal.style.display = ''; // 원래 CSS 스타일로 복원

            if (!autoPassword) {
                alert(res.message);
            } else {
                alert('세션이 만료되었거나 유효하지 않습니다. 다시 로그인해 주세요.');
            }
        }
    });
}

// 🔄 소켓 연결 시 세션에 저장된 키가 있다면 자동 재인증
socket.on('connect', () => {
    const savedKey = sessionStorage.getItem('superAdminKey');
    if (savedKey) {
        verifyLogin(savedKey);
    }
});

// 이미 소켓이 연결된 상태에서 스크립트가 로드되었을 경우 대비
if (socket.connected) {
    const savedKey = sessionStorage.getItem('superAdminKey');
    if (savedKey) {
        verifyLogin(savedKey);
    }
}

        // 엔터키 로그인 지원
        document.getElementById('master-password').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') verifyLogin();
        });

        function loadClubs() {
            if (!masterPassword) return;
            socket.emit('superAdmin:getClubs', masterPassword, (res) => {
                if (res.success) renderClubList(res.clubs);
            });
        }

        function renderClubList(clubs) {
            const listEl = document.getElementById('club-list');
            document.getElementById('club-count').innerText = clubs.length;

            if (clubs.length === 0) {
                listEl.innerHTML = '<div style="color: #666; text-align: center; padding: 40px;">등록된 클럽이 없습니다.</div>';
                return;
            }

            listEl.innerHTML = clubs.map(club => `
                <div class="club-item">
                    <div class="club-info">
                        <h3>${club.name} <span style="font-size:12px; color: #ff6600;">(${club.id})</span></h3>
                       <div class="club-meta">
                            <span>🏸 코트 ${club.courtCount}개</span>
                            <span>⏳ 게임대기 ${club.gameQueueCount || 0}팀</span>
                            <span>🏓 난타대기 ${club.nantaQueueCount || 0}팀</span>
                            <span>📶 Wi-Fi 제한: ${club.useWifi ? 'ON' : 'OFF'}</span>
                        </div>
                    </div>
                    <div class="club-actions">
                        <a href="/?club=${club.id}" target="_blank" class="btn-action btn-user">📱 회원앱</a>
                        <a href="/tv?club=${club.id}" target="_blank" class="btn-action btn-tv">📺 TV판</a>
                        <a href="/admin?club=${club.id}" target="_blank" class="btn-action btn-admin">⚙️ 관리자</a>
                        <button onclick="handleDeleteClub('${club.id}', '${club.name}')" class="btn-action btn-delete">🗑️ 삭제</button>
                    </div>
                </div>
            `).join('');
        }

        function handleCreateClub(e) {
            e.preventDefault();
            const clubId = document.getElementById('new-club-id').value.trim();
            const clubName = document.getElementById('new-club-name').value.trim();
            const courtCount = document.getElementById('new-club-courts').value;
            const adminPassword = document.getElementById('new-club-password').value.trim();

            socket.emit('superAdmin:createClub', {
                password: masterPassword,
                clubId, clubName, courtCount, adminPassword
            }, (res) => {
                alert(res.message);
                if (res.success) {
                    document.getElementById('create-club-form').reset();
                    loadClubs();
                }
            });
        }

        function handleDeleteClub(clubId, clubName) {
            if (!confirm(`정말로 [${clubName}] 클럽을 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;

            socket.emit('superAdmin:deleteClub', { password: masterPassword, clubId }, (res) => {
                alert(res.message);
                if (res.success) loadClubs();
            });
        }
    </script>
</body>
</html>
