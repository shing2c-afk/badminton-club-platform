<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운정배드민턴클럽 - 관리자 모드</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #ffffff; padding: 20px; max-width: 800px; margin: 0 auto; }

        h1 { color: #f59e0b; font-size: 20px; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #1f2937; padding-bottom: 10px; }

        .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

        .form-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .form-group label { font-size: 13px; color: #d1d5db; }
        .form-group input { background: #1f2937; border: 1px solid #374151; color: white; padding: 8px 10px; border-radius: 6px; width: 120px; text-align: right; font-size: 15px; outline: none; }
        .form-group input:focus { border-color: #3b82f6; }

        .court-item { display: flex; align-items: center; gap: 8px; background: #1f2937; border: 1px solid #374151; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .court-num { font-size: 15px; font-weight: bold; width: 65px; color: #f9fafb; flex-shrink: 0; }
        
        .court-select { 
            background: #111827; 
            border: 1px solid #3b82f6; 
            color: #ffffff; 
            padding: 10px 12px; 
            border-radius: 6px; 
            flex: 1; 
            font-size: 15px; 
            font-weight: bold;
            cursor: pointer;
            outline: none;
            height: 44px;
        }
        .court-select option {
            background: #111827;
            color: #ffffff;
            padding: 10px;
        }

        .court-note { background: #111827; border: 1px solid #4b5563; color: white; padding: 8px 10px; border-radius: 6px; flex: 1; font-size: 13px; height: 44px; outline: none; }
        .court-note:focus { border-color: #3b82f6; }
        
        .btn-del { background: #ef4444; color: white; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; flex-shrink: 0; }

        .btn-primary { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-add { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-link { background: #374151; color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 8px; font-size: 14px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>⚙️ 배드민턴 클럽 관리자 시스템</h1>

    <!-- 1. 타임아웃 및 비밀번호 설정 -->
    <div class="card">
        <div class="card-title">⏰ 타이머 및 관리자 보안 설정</div>
        <div class="form-group">
            <label>입장 대기 제한시간 (분):</label>
            <input type="number" id="entry-timeout" step="0.5" min="0.5">
        </div>
        <div class="form-group">
            <label>난타 코트 제한시간 (분):</label>
            <input type="number" id="nanta-timeout" step="1" min="1">
        </div>
        <div class="form-group">
            <label>관리자 접속 비밀번호:</label>
            <input type="text" id="admin-password">
        </div>
        <button class="btn-primary" onclick="saveConfig()">환경 설정 저장</button>
    </div>

    <!-- 2. 코트 운영 현황 설정 -->
    <div class="card">
        <div class="card-title">
            <span>🏸 코트 운영 현황 설정</span>
            <button class="btn-add" onclick="addCourtRow()">+ 코트 추가</button>
        </div>
        <div id="court-config-list"></div>
        <button class="btn-primary" style="background:#10b981;" onclick="saveCourtsConfig()">코트 구성 저장 및 현장에 적용</button>
    </div>

    <a href="/" class="btn-link">📱 사용자 메인 화면으로 돌아가기</a>

<script>
    const socket = io();
    let localCourts = [];
    let isInitialized = false; // 최초 1회만 서버 데이터로 채우기 위한 플래그

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    socket.on('stateUpdated', (data) => {
        // 관리자 수정 작업 중 서버의 실시간 통신으로 인한 화면 덮어쓰기를 방지합니다.
        if (isInitialized) return;

        if (data.config) {
            const entrySec = data.config.ENTRY_TIMEOUT_SEC || 180;
            const nantaSec = data.config.NANTA_COURT_LIMIT_SEC || 900;
            
            document.getElementById('entry-timeout').value = entrySec / 60;
            document.getElementById('nanta-timeout').value = nantaSec / 60;
            document.getElementById('admin-password').value = data.config.ADMIN_PASSWORD || '1234';
        }
        if (data.courtsData) {
            localCourts = JSON.parse(JSON.stringify(data.courtsData));
            renderCourtConfig();
        }

        isInitialized = true; // 최초 동기화 완료
    });

    function renderCourtConfig() {
        const container = document.getElementById('court-config-list');
        container.innerHTML = '';

        localCourts.forEach((court, idx) => {
            const courtType = court.type || 'game';
            const rawNote = (court.type === 'lesson' ? (court.players || court.note || '') : (court.note || ''));
            const noteVal = escapeHtml(rawNote);

            const html = `
                <div class="court-item" id="court-row-${idx}">
                    <span class="court-num">${idx + 1}번</span>
                    <select class="court-select" id="select-type-${idx}" onchange="onSelectChange(${idx}, this.value)">
                        <option value="game" ${courtType === 'game' ? 'selected' : ''}>게임 코트</option>
                        <option value="nanta" ${courtType === 'nanta' ? 'selected' : ''}>난타 코트</option>
                        <option value="lesson" ${courtType === 'lesson' ? 'selected' : ''}>레슨 코트</option>
                    </select>
                    <input type="text" class="court-note" id="note-${idx}" placeholder="레슨 안내문구" 
                           oninput="onNoteChange(${idx}, this.value)"
                           style="display:${courtType === 'lesson' ? 'block' : 'none'};" 
                           value="${noteVal}">
                    <button class="btn-del" onclick="deleteCourtRow(${idx})">삭제</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    function onSelectChange(idx, val) {
        localCourts[idx].type = val;
        const noteInput = document.getElementById(`note-${idx}`);
        if (noteInput) {
            noteInput.style.display = val === 'lesson' ? 'block' : 'none';
        }
    }

    function onNoteChange(idx, val) {
        localCourts[idx].note = val;
    }

    function addCourtRow() {
        localCourts.push({ type: 'game', label: '게임 코트', note: '' });
        renderCourtConfig();
    }

    function deleteCourtRow(idx) {
        localCourts.splice(idx, 1);
        renderCourtConfig();
    }

    function saveConfig() {
        const entryMin = parseFloat(document.getElementById('entry-timeout').value);
        const nantaMin = parseFloat(document.getElementById('nanta-timeout').value);
        const password = document.getElementById('admin-password').value.trim();

        const entrySec = Math.round((isNaN(entryMin) ? 3 : entryMin) * 60);
        const nantaSec = Math.round((isNaN(nantaMin) ? 15 : nantaMin) * 60);

        socket.emit('updateConfig', {
            ENTRY_TIMEOUT_SEC: entrySec,
            NANTA_COURT_LIMIT_SEC: nantaSec,
            ADMIN_PASSWORD: password || '1234'
        });
        alert('설정이 성공적으로 저장되었습니다.');
    }

    function saveCourtsConfig() {
        let newCourts = [];
        for (let i = 0; i < localCourts.length; i++) {
            const typeSelect = document.getElementById(`select-type-${i}`);
            const noteInput = document.getElementById(`note-${i}`);
            if (typeSelect) {
                newCourts.push({
                    type: typeSelect.value,
                    note: noteInput ? noteInput.value : ''
                });
            }
        }

        socket.emit('updateCourtsConfig', newCourts);
        alert('코트 구성 설정이 현장에 즉시 반영되었습니다.');
    }
</script>
</body>
</html>
