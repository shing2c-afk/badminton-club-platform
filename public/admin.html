<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운정배드민턴클럽 - 관리자 모드</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #ffffff; padding: 20px; max-width: 800px; margin: 0 auto; }

        h1 { color: #f59e0b; font-size: 20px; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #1f2937; padding-bottom: 10px; }

        .card { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

        .form-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .form-group label { font-size: 13px; color: #d1d5db; }
        .form-group input, .form-group select { background: #1f2937; border: 1px solid #374151; color: white; padding: 8px 10px; border-radius: 6px; width: 150px; text-align: right; font-size: 15px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #3b82f6; }

        .court-item { display: flex; align-items: center; gap: 8px; background: #1f2937; border: 1px solid #374151; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .court-num { font-size: 15px; font-weight: bold; width: 65px; color: #f9fafb; flex-shrink: 0; }
        
        .court-select { 
            background: #111827; 
            border: 1px solid #3b82f6; 
            color: #ffffff; 
            padding: 10px 12px; 
            border-radius: 6px; 
            flex: 1; 
            font-size: 15px; 
            font-weight: bold;
            cursor: pointer;
            outline: none;
            height: 44px;
        }
        .court-select option {
            background: #111827;
            color: #ffffff;
            padding: 10px;
        }

        .court-note { background: #111827; border: 1px solid #4b5563; color: white; padding: 8px 10px; border-radius: 6px; flex: 1; font-size: 13px; height: 44px; outline: none; }
        .court-note:focus { border-color: #3b82f6; }
        
        .btn-del { background: #ef4444; color: white; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; flex-shrink: 0; }

        .btn-primary { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-add { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-link { background: #374151; color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 8px; font-size: 14px; margin-top: 20px; font-weight: bold; }

        .list-container { max-height: 150px; overflow-y: auto; background: #1f2937; border-radius: 6px; padding: 8px; margin-bottom: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid #374151; font-size: 14px; }
        .list-item:last-child { border-bottom: none; }
        .btn-sm-del { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>⚙️ 배드민턴 클럽 관리자 시스템</h1>

    <div class="card">
        <div class="card-title">⏰ 타이머 및 관리자 보안 설정</div>
        <div class="form-group">
            <label>입장 대기 제한시간 (분):</label>
            <input type="number" id="entry-timeout" step="0.5" min="0.5">
        </div>
        <div class="form-group">
            <label>난타 코트 제한시간 (분):</label>
            <input type="number" id="nanta-timeout" step="1" min="1">
        </div>
        <div class="form-group">
            <label>관리자 접속 비밀번호:</label>
            <input type="text" id="admin-password">
        </div>
        <button class="btn-primary" onclick="saveConfig()">환경 설정 저장</button>
    </div>

    <div class="card">
        <div class="card-title">
            <span>🏸 코트 운영 현황 설정</span>
            <button class="btn-add" onclick="addCourtRow()">+ 코트 추가</button>
        </div>
        <div id="court-config-list"></div>
        <button class="btn-primary" style="background:#10b981;" onclick="saveCourtsConfig()">코트 구성 저장 및 현장에 적용</button>
    </div>

    <div class="card" style="border-color: #b91c1c;">
        <div class="card-title" style="color: #ef4444;">🚨 회원 강제 퇴장 (대기열/참여 일괄 정리)</div>
        <div class="form-group">
            <label>퇴장시킬 회원 선택:</label>
            <select id="kick-user-select">
                <option value="">-- 회원을 선택하세요 --</option>
            </select>
        </div>
        <button class="btn-danger" onclick="executeKickUser()">선택 회원 강제 퇴장 조치</button>
    </div>

    <div class="card" style="border-color: #b91c1c;">
        <div class="card-title" style="color: #ef4444;">💥 게임방 / 난타방 강제 종료 (폭파)</div>
        <div class="form-group">
            <label>종료할 방 선택:</label>
            <select id="delete-room-select">
                <option value="">-- 활성화된 방을 선택하세요 --</option>
            </select>
        </div>
        <button class="btn-danger" onclick="executeDeleteRoom()">선택한 방 강제 종료</button>
    </div>

   <div class="card" style="border-color: #b91c1c;">
        <div class="card-title" style="color: #ef4444;">🏸 코트 강제 비우기 (게임 / 난타 / 레슨)</div>
        <div class="form-group">
            <p style="margin-bottom: 10px; color: #cbd5e1; font-size: 14px;">현재 진행 중이거나 점유된 코트를 강제 초기화하여 빈 코트로 만듭니다.</p>
            <label>비울 코트 선택:</label>
            <select id="clear-court-select">
                <option value="">-- 비울 코트를 선택하세요 --</option>
            </select>
        </div>
        <button class="btn-danger" onclick="handleClearCourt()">선택한 코트 강제 비우기</button>
    </div>

    <a href="/" class="btn-link">📱 사용자 메인 화면으로 돌아가기</a>

<script>
    const socket = io();
    let localCourts = [];
    let isInitialized = false; 
    let activeUsersList = []; // 실시간 대기/참여 중인 회원 목록 저장용
    let activeRoomsList = []; // 실시간 활성 방 목록 저장용

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    socket.on('stateUpdated', (data) => {
        if (data.config) {
            const entrySec = data.config.ENTRY_TIMEOUT_SEC || 180;
            const nantaSec = data.config.NANTA_COURT_LIMIT_SEC || 900;
            
            // 최초 1회만 기본 설정값 채우기
            if (!isInitialized) {
                document.getElementById('entry-timeout').value = entrySec / 60;
                document.getElementById('nanta-timeout').value = nantaSec / 60;
                document.getElementById('admin-password').value = data.config.ADMIN_PASSWORD || '1234';
            }
        }
        if (data.courtsData && !isInitialized) {
            localCourts = JSON.parse(JSON.stringify(data.courtsData));
            renderCourtConfig();
        }

        // 실시간 대기/참여자 및 활성 방 데이터 수집 및 드롭다운 갱신
        updateAdminDropdowns(data);

        isInitialized = true; 
    });

    // =================================================================
    // 1. 관리자 제어용 드롭다운 목록 실시간 갱신 함수 (회원, 방, 코트 통합)
    // =================================================================
    function updateAdminDropdowns(data) {
        const userSelect = document.getElementById('kick-user-select');
        const roomSelect = document.getElementById('delete-room-select');
        const courtSelect = document.getElementById('clear-court-select'); // 코트 비우기 셀렉트
        
        const selectedUser = userSelect ? userSelect.value : '';
        const selectedRoom = roomSelect ? roomSelect.value : '';
        const selectedCourt = courtSelect ? courtSelect.value : '';

        if (userSelect) userSelect.innerHTML = '<option value="">-- 회원을 선택하세요 --</option>';
        if (roomSelect) roomSelect.innerHTML = '<option value="">-- 활성화된 방을 선택하세요 --</option>';
        if (courtSelect) courtSelect.innerHTML = '<option value="">-- 비울 코트를 선택하세요 --</option>';

        let uniqueUsersMap = new Map();
        let rooms = [];

        const collectUser = (id, name, gender, grade) => {
            if (!id) return;
            if (!uniqueUsersMap.has(id)) {
                uniqueUsersMap.set(id, {
                    username: id,
                    displayName: (name && name !== id) ? name : id
                });
            }
        };

        // 1. 게임 큐(gameQueue) 스캔
        if (data.gameQueue && Array.isArray(data.gameQueue)) {
            data.gameQueue.forEach((slot, index) => {
                const roomId = slot.id !== undefined ? slot.id : index;
                const participants = slot.players ? slot.players.filter(Boolean).join(', ') : '인원 없음';
                const roomTitle = `게임 코트방 #${index + 1} (참여자: ${participants})`;
                
                rooms.push({ type: 'game', id: roomId, label: roomTitle });

                if (slot.userIds && Array.isArray(slot.userIds)) {
                    slot.userIds.forEach((id, idx) => {
                        const name = slot.players ? slot.players[idx] : '';
                        collectUser(id, name);
                    });
                } else if (slot.players && Array.isArray(slot.players)) {
                    slot.players.forEach(p => { if (p) collectUser(p, p); });
                }
            });
        }

        // 2. 난타 큐(nantaQueue) 스캔
        if (data.nantaQueue && Array.isArray(data.nantaQueue)) {
            data.nantaQueue.forEach((slot, index) => {
                const roomId = slot.id !== undefined ? slot.id : index;
                const participants = slot.players ? slot.players.filter(Boolean).join(', ') : '인원 없음';
                const roomTitle = `난타 코트방 #${index + 1} (참여자: ${participants})`;
                
                rooms.push({ type: 'nanta', id: roomId, label: roomTitle });

                if (slot.userIds && Array.isArray(slot.userIds)) {
                    slot.userIds.forEach((id, idx) => {
                        const name = slot.players ? slot.players[idx] : '';
                        collectUser(id, name);
                    });
                } else if (slot.players && Array.isArray(slot.players)) {
                    slot.players.forEach(p => { if (p) collectUser(p, p); });
                }
            });
        }

        // 3. 코트 데이터(courtsData) 스캔 및 드롭다운 채우기 (💡 난타 A/B구역 분할 적용 완료)
        if (data.courtsData && Array.isArray(data.courtsData) && courtSelect) {
            data.courtsData.forEach(court => {
                if (court.type === 'game') {
                    if (!court.isEmpty && court.players) {
                        const opt = document.createElement('option');
                        opt.value = court.id;
                        opt.textContent = `[게임코트 #${court.id}] ${court.players}`;
                        if (String(court.id) === selectedCourt) opt.selected = true;
                        courtSelect.appendChild(opt);
                    }
                } else if (court.type === 'nanta') {
                    // A구역이 사용 중이면 옵션 추가
                    if (court.sideA && !court.sideA.isEmpty && court.sideA.players) {
                        const optA = document.createElement('option');
                        optA.value = `${court.id}:A`; // 예: "6:A"
                        optA.textContent = `[난타코트 #${court.id} A구역] ${court.sideA.players}`;
                        if (`${court.id}:A` === selectedCourt) optA.selected = true;
                        courtSelect.appendChild(optA);
                    }
                    // B구역이 사용 중이면 옵션 추가
                    if (court.sideB && !court.sideB.isEmpty && court.sideB.players) {
                        const optB = document.createElement('option');
                        optB.value = `${court.id}:B`; // 예: "6:B"
                        optB.textContent = `[난타코트 #${court.id} B구역] ${court.sideB.players}`;
                        if (`${court.id}:B` === selectedCourt) optB.selected = true;
                        courtSelect.appendChild(optB);
                    }
                } else if (court.type === 'lesson') {
                    if (!court.isEmpty) {
                        const opt = document.createElement('option');
                        opt.value = court.id;
                        opt.textContent = `[레슨코트 #${court.id}] ${court.players || '레슨 중'}`;
                        if (String(court.id) === selectedCourt) opt.selected = true;
                        courtSelect.appendChild(opt);
                    }
                }
            });
        }

        // 회원 드롭다운 채우기
        if (userSelect) {
            userSelect.innerHTML = '<option value="">-- 회원 선택 -- opsi</option>'; // 초기화 옵션 추가 권장
                uniqueUsersMap.forEach((user) => {
                const opt = document.createElement('option');
                // 💡 id가 있으면 id를, 없으면 username을 value로 확실하게 지정
                opt.value = user.id || user.username; 
                opt.textContent = `${user.name || user.displayName || user.username} (${user.username || user.id})`;
                if (user.username === selectedUser || user.id === selectedUser) opt.selected = true;
                userSelect.appendChild(opt);
            });
        }

        // 방 드롭다운 채우기
        if (roomSelect) {
            rooms.forEach(room => {
                const opt = document.createElement('option');
                opt.value = `${room.type}:${room.id}`;
                opt.textContent = room.label;
                if (opt.value === selectedRoom) opt.selected = true;
                roomSelect.appendChild(opt);
            });
        }
    }


    // =================================================================
    // 2. 관리자 기능 실행 함수들 (강제 퇴장, 방 강제 종료, 코트 비우기)
    // =================================================================

    // 🚨 선택 회원 강제 퇴장 실행
    async function executeKickUser() {
        const targetUsername = document.getElementById('kick-user-select').value;
        if (!targetUsername) {
            alert('강제 퇴장시킬 회원을 선택해주세요.');
            return;
        }

        if (!confirm(`[${targetUsername}]님을 대기열 및 모든 방에서 강제 퇴장시키겠습니까?`)) return;

        try {
            const response = await fetch('/api/admin/kick-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetUsername })
            });
            const result = await response.json();
            if (result.success) {
                alert(result.message);
            } else {
                alert('퇴장 처리 실패: ' + result.message);
            }
        } catch (err) {
            console.error('강제 퇴장 에러:', err);
            alert('서버 통신 중 오류가 발생했습니다.');
        }
    }

    // 💥 선택 방 강제 종료 실행
    async function executeDeleteRoom() {
        const roomVal = document.getElementById('delete-room-select').value;
        if (!roomVal) {
            alert('강제 종료할 방을 선택해주세요.');
            return;
        }

        const [roomType, roomIdStr] = roomVal.split(':');
        const roomId = isNaN(roomIdStr) ? roomIdStr : Number(roomIdStr);

        if (!confirm(`선택한 ${roomType === 'game' ? '게임방' : '난타방'}을 즉시 강제 종료(폭파)하시겠습니까?`)) return;

        try {
            const response = await fetch('/api/admin/delete-room', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomType, roomId })
            });
            const result = await response.json();
            if (result.success) {
                alert(result.message);
            } else {
                alert('방 강제 종료 실패: ' + result.message);
            }
        } catch (err) {
            console.error('방 강제 종료 에러:', err);
            alert('서버 통신 중 오류가 발생했습니다.');
        }
    }

    // =================================================================
    // 🏸 선택 코트(구역) 강제 비우기 실행 (난타 A/B구역 분할 반영)
    // =================================================================
    async function handleClearCourt() {
        const courtSelect = document.getElementById('clear-court-select');
        const val = courtSelect.value;

        if (!val) {
            alert('⚠️ 강제로 비울 코트를 선택해 주세요.');
            return;
        }

        let courtId, side = null;
        // '6:A' 또는 '6:B' 형식인 경우 파싱, 일반 코트 번호인 경우 그대로 처리
        if (val.includes(':')) {
            const parts = val.split(':');
            courtId = Number(parts[0]);
            side = parts[1]; // 'A' 또는 'B'
        } else {
            courtId = Number(val);
        }

        let confirmMsg = side ? `정말 ${courtId}번 난타 코트 ${side}구역을 강제 초기화(비우기) 하시겠습니까?` : `정말 ${courtId}번 코트를 강제 초기화(비우기) 하시겠습니까?`;

        if (confirm(confirmMsg)) {
            try {
                const response = await fetch('/api/admin/clear-court', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ courtId: Number(courtId), side: side })
                });

                const result = await response.json();
                if (result.success) {
                    alert(`✅ ${result.message}`);
                    courtSelect.value = '';
                } else {
                    alert(`❌ 실패: ${result.message}`);
                }
            } catch (err) {
                console.error('코트 강제 비우기 통신 에러:', err);
                alert('⚠️ 서버 통신 중 오류가 발생했습니다.');
            }
        }
    }

    function renderCourtConfig() {
        const container = document.getElementById('court-config-list');
        if (!container) return;
        container.innerHTML = '';

        localCourts.forEach((court, idx) => {
            const courtType = court.type || 'game';
            const rawNote = (court.type === 'lesson' ? (court.players || court.note || '') : (court.note || ''));
            const noteVal = escapeHtml(rawNote);

            const html = `
                <div class="court-item" id="court-row-${idx}">
                    <span class="court-num">${idx + 1}번</span>
                    <select class="court-select" id="select-type-${idx}" onchange="onSelectChange(${idx}, this.value)">
                        <option value="game" ${courtType === 'game' ? 'selected' : ''}>게임 코트</option>
                        <option value="nanta" ${courtType === 'nanta' ? 'selected' : ''}>난타 코트</option>
                        <option value="lesson" ${courtType === 'lesson' ? 'selected' : ''}>레슨 코트</option>
                    </select>
                    <input type="text" class="court-note" id="note-${idx}" placeholder="레슨 안내문구" 
                           oninput="onNoteChange(${idx}, this.value)"
                           style="display:${courtType === 'lesson' ? 'block' : 'none'};" 
                           value="${noteVal}">
                    <button class="btn-del" onclick="deleteCourtRow(${idx})">삭제</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    function onSelectChange(idx, val) {
        localCourts[idx].type = val;
        const noteInput = document.getElementById(`note-${idx}`);
        if (noteInput) {
            noteInput.style.display = val === 'lesson' ? 'block' : 'none';
        }
    }

    function onNoteChange(idx, val) {
        localCourts[idx].note = val;
    }

    function addCourtRow() {
        localCourts.push({ type: 'game', label: '게임 코트', note: '' });
        renderCourtConfig();
    }

    function deleteCourtRow(idx) {
        localCourts.splice(idx, 1);
        renderCourtConfig();
    }

    function saveConfig() {
        const entryMin = parseFloat(document.getElementById('entry-timeout').value);
        const nantaMin = parseFloat(document.getElementById('nanta-timeout').value);
        const password = document.getElementById('admin-password').value.trim();

        const entrySec = Math.round((isNaN(entryMin) ? 3 : entryMin) * 60);
        const nantaSec = Math.round((isNaN(nantaMin) ? 15 : nantaMin) * 60);

        socket.emit('updateConfig', {
            ENTRY_TIMEOUT_SEC: entrySec,
            NANTA_COURT_LIMIT_SEC: nantaSec,
            ADMIN_PASSWORD: password || '1234'
        });
        alert('설정이 성공적으로 저장되었습니다.');
    }

    function saveCourtsConfig() {
        let newCourts = [];
        for (let i = 0; i < localCourts.length; i++) {
            const typeSelect = document.getElementById(`select-type-${i}`);
            const noteInput = document.getElementById(`note-${i}`);
            if (typeSelect) {
                newCourts.push({
                    type: typeSelect.value,
                    note: noteInput ? noteInput.value : ''
                });
            }
        }

        socket.emit('updateCourtsConfig', newCourts);
        alert('코트 구성 설정이 현장에 즉시 반영되었습니다.');
    }
</script>
