<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배드민턴 클럽 - 공지사항</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 🌐 브라우저 기본 alert을 가로채어 URL 노출을 없애고 모바일 풀 폭으로 띄우는 전역 커스텀 모달 스크립트 -->
    <script>
        window.showGlobalModal = function(message) {
            let modal = document.getElementById('custom-alert-modal');
            if (modal) {
                const msgEl = document.getElementById('custom-alert-message');
                if (msgEl) msgEl.innerText = message;
                modal.style.display = 'flex';
            }
        };

        window.alert = function(message) {
            window.showGlobalModal(message);
        };
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <!-- 상단 헤더 -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">📢 클럽 공지사항</h1>
            <a href="/" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-sm">메인으로 돌아가기</a>
        </div>

        <!-- 공지사항 리스트 영역 (조회 전용) -->
        <div id="notice-container" class="space-y-4">
            <div class="text-center py-10 text-gray-500">공지사항을 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- 🌐 커스텀 모달 HTML 뼈대 (화면 최하단 배치) -->
    <div id="custom-alert-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 999999; justify-content: center; align-items: center; padding: 16px; box-sizing: border-box;">
        <div style="background: #111827; border: 1.5px solid #374151; border-radius: 14px; padding: 24px 20px; width: 100%; max-width: 420px; box-sizing: border-box; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.7); display: flex; flex-direction: column; gap: 16px;">
            <p id="custom-alert-message" style="color: #f3f4f6; font-size: 15.5px; font-weight: 600; line-height: 1.5; word-break: keep-all; margin: 0;"></p>
            <button onclick="document.getElementById('custom-alert-modal').style.display='none'" style="width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;">확인</button>
        </div>
    </div>

    <script>
        async function fetchNotices() {
            try {
                const response = await fetch('/api/notices');
                const notices = await response.json();
                
                const container = document.getElementById('notice-container');
                if (!notices || notices.length === 0) {
                    container.innerHTML = '<div class="bg-white p-6 rounded-lg shadow text-center text-gray-500">등록된 공지사항이 없습니다.</div>';
                    return;
                }

                // 회원 전용: 수정/삭제 버튼 없이 깔끔하게 출력
                container.innerHTML = notices.map(notice => `
                    <div class="bg-white p-6 rounded-lg shadow hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <h2 class="text-xl font-semibold text-gray-800">${escapeHtml(notice.title)}</h2>
                            <span class="text-sm text-gray-400">${notice.createdAt || ''}</span>
                        </div>
                        <p class="text-gray-600 whitespace-pre-line mt-3">${escapeHtml(notice.content)}</p>
                        <div class="mt-4 text-right text-xs text-gray-400">작성자: ${escapeHtml(notice.author || '관리자')}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('공지사항 로드 오류:', error);
                document.getElementById('notice-container').innerHTML = '<div class="bg-red-50 p-4 text-red-500 rounded-lg text-center">공지사항을 불러오지 못했습니다.</div>';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        fetchNotices();
    </script>
</body>
</html>
