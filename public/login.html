<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>운정배드민턴클럽 - 로그인</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0b0f19; color: #ffffff; 
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .login-card { background: #111827; border: 1px solid #374151; border-radius: 14px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .title { font-size: 20px; font-weight: 800; color: #f59e0b; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 6px; font-weight: bold; }
        .input-field { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: white; font-size: 14px; }
        .input-field:focus { outline: none; border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .footer-link { margin-top: 16px; text-align: center; font-size: 12px; color: #6b7280; }
        .footer-link a { color: #38bdf8; text-decoration: none; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="title">🏸 운정배드민턴클럽 로그인</div>
        
        <form id="login-form">
            <div class="input-group">
                <label>회원 이름 (급수/성별/이름)</label>
                <input type="text" id="username" class="input-field" placeholder="예: A/남/홍길동" required>
            </div>
            <div class="input-group">
                <label>비밀번호 (전화번호 뒤 4자리 등)</label>
                <input type="password" id="password" class="input-field" placeholder="****" required>
            </div>
            <button type="submit" class="btn-submit">로그인 / 입장</button>
        </form>

        <div class="footer-link">
            계정이 없으신가요? <a href="#" onclick="guestLogin()">게스트로 계속하기</a>
        </div>
    </div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (username && password) {
            // 간단 세션 처리 (로컬 스토리지에 회원 정보 저장)
            localStorage.setItem('clubUser', JSON.stringify({ name: username, isLogin: true }));
            alert(`${username}님, 환영합니다!`);
            window.location.href = '/index.html';
        }
    });

    function guestLogin() {
        localStorage.setItem('clubUser', JSON.stringify({ name: '게스트', isLogin: false }));
        window.location.href = '/index.html';
    }
</script>
</body>
</html>
